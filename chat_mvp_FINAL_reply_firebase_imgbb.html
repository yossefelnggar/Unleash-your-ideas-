<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>الدردشة الخاصة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --bg:#f5f3ee;--paper:#fff;--ink:#171512;--muted:#77716a;--line:#171512;
  --brand:#6c4dfb;--soft:#eeeae3;--mine:#6c4dfb;--danger:#e5484d;--ok:#13a673;
  --shadow:3px 3px 0 var(--line);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}
.hidden{display:none!important}
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,243,238,.96);backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.topbar-inner{max-width:820px;margin:auto;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900}
.logo{width:38px;height:38px;border:2px solid var(--line);border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900}
.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chat{width:100%;max-width:820px;margin:auto;display:flex;flex:1;flex-direction:column}
.messages{flex:1;padding:18px 14px 120px;overflow-y:auto}
.message{display:flex;gap:8px;margin:0 0 12px;align-items:flex-end}
.message.mine{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--soft);object-fit:cover;flex:0 0 auto}
.message-content{max-width:min(78%,600px)}
.bubble{border:2px solid var(--line);background:var(--paper);border-radius:17px 17px 17px 5px;padding:9px 13px;line-height:1.65;word-break:break-word;box-shadow:1px 1px 0 rgba(0,0,0,.05)}
.mine .bubble{background:var(--mine);color:#fff;border-radius:17px 17px 5px 17px}
.meta{font-size:10px;color:var(--muted);margin:3px 5px 0}
.mine .meta{text-align:right}
.image{display:block;max-width:100%;max-height:420px;border-radius:12px;border:2px solid var(--line);margin-bottom:6px;cursor:pointer}
.composer-wrap{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:2px solid var(--line);padding:9px max(12px,calc((100vw - 820px)/2 + 12px)) calc(9px + env(safe-area-inset-bottom))}
.composer{display:flex;align-items:flex-end;gap:7px}
.text{flex:1;min-height:44px;max-height:120px;resize:none;border:2px solid var(--line);border-radius:14px;padding:10px 12px;outline:none;background:#fff}
.text:focus{box-shadow:2px 2px 0 var(--brand)}
.icon-btn,.send{height:44px;min-width:44px;border:2px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.send{background:var(--brand);color:#fff}
.icon-btn:active,.send:active{transform:translate(2px,2px);box-shadow:none}
.icon-btn:disabled,.send:disabled{opacity:.5;cursor:not-allowed}
.preview{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.preview img{width:58px;height:58px;object-fit:cover;border:2px solid var(--line);border-radius:10px}
.preview button{border:0;background:var(--soft);width:30px;height:30px;border-radius:50%;cursor:pointer}
.screen{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(440px,100%);background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px}
.field{width:100%;border:2px solid var(--line);border-radius:13px;padding:12px 14px;margin:8px 0 14px;outline:none}
.field:focus{box-shadow:2px 2px 0 var(--brand)}
.primary{width:100%;border:2px solid var(--line);border-radius:13px;padding:12px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.note{color:var(--muted);font-size:12px;line-height:1.8}
.empty{text-align:center;color:var(--muted);padding:60px 15px}
.typing{font-size:11px;color:var(--muted);padding:0 8px 5px}
.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);z-index:100;background:var(--ink);color:#fff;border-radius:12px;padding:9px 14px;font-size:13px;box-shadow:var(--shadow)}
.toast.error{background:var(--danger)}
.preview-label{font-size:11px;color:var(--muted)}
@media(max-width:600px){.message-content{max-width:84%}.messages{padding-bottom:125px}.card{box-shadow:none}}
</style>
<style>
.hidden{display:none!important}
.status{padding:10px 16px;font-size:13px}
.status.error{color:#9b1c1c;background:#fff1f1;border-bottom:1px solid #ffd7d7}
.status.info{color:#725d1d;background:#fff9e8;border-bottom:1px solid #eee0ad}
.online{color:#237a3b;font-size:12px}.offline{color:#b42318;font-size:12px}
.reply-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 14px;background:#f2f0e7;border-top:1px solid #dedacc}
.reply-bar strong,.reply-bar span{display:block}.reply-bar strong{font-size:12px;color:#5d6740}.reply-bar span{font-size:13px;max-width:75vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reply-bar button{border:0;background:transparent;font-size:24px;cursor:pointer}
.quoted{border-right:3px solid #7b8652;background:#f6f5ef;padding:6px 8px;margin-bottom:7px;border-radius:6px;font-size:12px}.quoted strong,.quoted span{display:block}.quoted span{color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-btn{border:0;background:transparent;padding:4px 0;margin-top:3px;font-size:12px;cursor:pointer;color:#687447}
.message-row{display:flex;margin:8px 12px}.message-row.mine{justify-content:flex-start}.message-row.theirs{justify-content:flex-end}
.message{max-width:min(78%,520px);padding:9px 11px;border-radius:13px;background:#f3f1e8;box-shadow:0 1px 2px #00000010}.message-row.mine .message{background:#e6ecd8}
.message-top{display:flex;gap:9px;align-items:center;margin-bottom:4px}.sender{font-weight:700;font-size:12px}.time{font-size:10px;color:#777}.message-text{font-size:14px;line-height:1.65;word-break:break-word}
.message-image{display:block;max-width:100%;max-height:330px;border-radius:9px;margin-top:6px}
.image-preview{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid #e4e1d8}.image-preview img{width:70px;height:70px;object-fit:cover;border-radius:8px}.image-preview button{border:0;padding:7px 10px;border-radius:7px;cursor:pointer}
.send:disabled{opacity:.55;cursor:not-allowed}
</style></head>
<body>

<div id="root"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged,
  setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getDatabase, ref, push, set, query, limitToLast,
  onValue, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAM11KB7jbdZC0EiPyOgIawxzGZITgMA8",
  authDomain: "flash-feedback-9c529.firebaseapp.com",
  databaseURL: "https://flash-feedback-9c529-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "flash-feedback-9c529",
  storageBucket: "flash-feedback-9c529.firebasestorage.app",
  messagingSenderId: "1026286586523",
  appId: "1:1026286586523:web:b76e33473c260fc4d7143e",
  measurementId: "G-R93914YBXY"
};

const IMGBB_API_KEY = "0dade31c18202a2a4fd8b847ab3ef9e";
const CHAT_PATH = "chats/private-chat/messages";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let myName = localStorage.getItem("chat_name") || "";
let unsubscribeMessages = null;
let selectedImage = null;
let replyingTo = null;
let opening = false;

const $ = id => document.getElementById(id);

function esc(v = "") {
  return String(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function timeOf(v) {
  if (!v) return "";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "" :
    d.toLocaleTimeString("ar-EG", {hour:"2-digit", minute:"2-digit"});
}

function status(msg, type="info") {
  const e = $("status");
  if (!e) return;
  e.textContent = msg;
  e.className = `status ${type}`;
}

function authError(e) {
  if (e?.code === "auth/operation-not-allowed")
    return "Anonymous غير مفعّل في Firebase. افتح Authentication → Sign-in method → فعّل Anonymous.";
  if (e?.code === "auth/network-request-failed")
    return "فشل الاتصال بـ Firebase. تحقق من الإنترنت ثم أعد المحاولة.";
  return `تعذر الاتصال بالمحادثة (${e?.code || "unknown"}). ${e?.message || ""}`;
}

function nameScreen() {
  $("app").innerHTML = `
    <section class="card name-card">
      <div class="logo">C</div>
      <h1>الدردشة الخاصة</h1>
      <p class="muted">اكتب اسمك للبدء.</p>
      <form id="nameForm">
        <label>اسمك</label>
        <input id="nameInput" maxlength="60" required autocomplete="name" placeholder="اكتب اسمك...">
        <button class="primary" type="submit">دخول إلى المحادثة</button>
      </form>
    </section>`;
  $("nameInput").value = myName;
  $("nameForm").onsubmit = async e => {
    e.preventDefault();
    myName = $("nameInput").value.trim().replace(/\s+/g," ").slice(0,60);
    if (!myName) return;
    localStorage.setItem("chat_name", myName);
    openChat();
  };
}

function chatScreen() {
  $("app").innerHTML = `
    <section class="chat-card">
      <header class="chat-header">
        <div class="person">
          <div class="avatar">${esc(myName.charAt(0).toUpperCase())}</div>
          <div><h1>الدردشة الخاصة</h1><span id="connectionState">جاري الاتصال...</span></div>
        </div>
        <button id="changeNameBtn" class="ghost" type="button">تغيير الاسم</button>
      </header>
      <div id="status" class="status info">جاري تجهيز المحادثة...</div>
      <main id="messages" class="messages" aria-live="polite"></main>
      <div id="replyBar" class="reply-bar hidden">
        <div><strong>الرد على</strong><span id="replyText"></span></div>
        <button id="cancelReply" type="button">×</button>
      </div>
      <div id="imagePreview" class="image-preview hidden">
        <img id="previewImg" alt="معاينة">
        <button id="removeImage" type="button">إزالة</button>
      </div>
      <form id="messageForm" class="composer">
        <label class="attach" title="إرفاق صورة">
          <input id="imageInput" type="file" accept="image/*" hidden>
          <span>＋</span>
        </label>
        <textarea id="messageInput" maxlength="2000" rows="1" placeholder="اكتب رسالة..."></textarea>
        <button class="send" type="submit">إرسال</button>
      </form>
      <div class="hint">Enter للإرسال • Shift+Enter لسطر جديد • ↩ رد للرد على رسالة</div>
    </section>`;

  $("changeNameBtn").onclick = () => {
    if (unsubscribeMessages) unsubscribeMessages();
    unsubscribeMessages = null;
    nameScreen();
  };
  $("cancelReply").onclick = clearReply;
  $("removeImage").onclick = clearImage;
  $("imageInput").onchange = selectImage;
  $("messageForm").onsubmit = async e => { e.preventDefault(); await sendMessage(); };
  $("messageInput").onkeydown = e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      $("messageForm").requestSubmit();
    }
  };
}

function setReply(m) {
  replyingTo = {
    messageId: m.id,
    senderName: m.senderName || "مستخدم",
    text: m.text || (m.imageUrl ? "صورة" : "")
  };
  $("replyText").textContent = `${replyingTo.senderName}: ${replyingTo.text.slice(0,100)}`;
  $("replyBar").classList.remove("hidden");
  $("messageInput").focus();
}

function clearReply() {
  replyingTo = null;
  $("replyBar")?.classList.add("hidden");
}

function clearImage() {
  selectedImage = null;
  if ($("imageInput")) $("imageInput").value = "";
  $("imagePreview")?.classList.add("hidden");
}

function compressImage(file, maxWidth=1600, quality=.82) {
  return new Promise((resolve,reject) => {
    if (!file?.type?.startsWith("image/")) return reject(new Error("الملف ليس صورة."));
    if (file.size > 10*1024*1024) return reject(new Error("حجم الصورة أكبر من 10MB."));
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, maxWidth/img.width);
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width*ratio));
        c.height = Math.max(1, Math.round(img.height*ratio));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        c.toBlob(b => b ? resolve(b) : reject(new Error("فشل ضغط الصورة.")),
          "image/jpeg", quality);
      };
      img.onerror = () => reject(new Error("تعذر قراءة الصورة."));
      img.src = r.result;
    };
    r.onerror = () => reject(new Error("تعذر قراءة الملف."));
    r.readAsDataURL(file);
  });
}

async function uploadImgBB(file) {
  const blob = await compressImage(file);
  const b64 = await new Promise((resolve,reject) => {
    const r = new FileReader();
    r.onloadend = () => resolve(String(r.result).split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
  const f = new FormData();
  f.append("image", b64);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
    method:"POST", body:f
  });
  const data = await res.json().catch(() => null);
  if (!res.ok || !data?.success)
    throw new Error(data?.error?.message || "فشل رفع الصورة.");
  return {
    url:data.data.url,
    displayUrl:data.data.display_url || data.data.url,
    thumbnail:data.data.thumb?.url || data.data.url
  };
}

async function selectImage(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    selectedImage = file;
    const b = await compressImage(file,900,.8);
    $("previewImg").src = URL.createObjectURL(b);
    $("imagePreview").classList.remove("hidden");
  } catch(err) {
    selectedImage = null;
    e.target.value = "";
    alert(err.message);
  }
}

function renderMessages(snapshot) {
  const box = $("messages");
  if (!box) return;
  const rows = [];
  snapshot.forEach(x => rows.push({id:x.key,...x.val()}));
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 150;

  box.innerHTML = rows.map(m => {
    const mine = m.senderId === currentUser?.uid;
    const q = m.replyTo;
    return `
      <article class="message-row ${mine ? "mine":"theirs"}">
        <div class="message">
          <div class="message-top">
            <span class="sender">${esc(m.senderName || "مستخدم")}</span>
            <span class="time">${timeOf(m.createdAt)}</span>
          </div>
          ${q ? `<div class="quoted"><strong>${esc(q.senderName)}</strong><span>${esc(q.text || "صورة")}</span></div>` : ""}
          ${m.text ? `<div class="message-text">${esc(m.text).replace(/\n/g,"<br>")}</div>` : ""}
          ${m.imageUrl ? `<a href="${esc(m.imageUrl)}" target="_blank" rel="noopener noreferrer">
            <img class="message-image" src="${esc(m.displayUrl || m.imageUrl)}" alt="صورة" loading="lazy"></a>` : ""}
          <button class="reply-btn" type="button" data-id="${esc(m.id)}">↩ رد</button>
        </div>
      </article>`;
  }).join("");

  box.querySelectorAll(".reply-btn").forEach(b => {
    b.onclick = () => {
      const m = rows.find(x => x.id === b.dataset.id);
      if (m) setReply(m);
    };
  });
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

function subscribe() {
  if (unsubscribeMessages) unsubscribeMessages();
  const q = query(ref(db,CHAT_PATH),limitToLast(200));
  unsubscribeMessages = onValue(q, renderMessages, e => {
    $("connectionState").textContent = "تعذر الاتصال";
    $("connectionState").className = "offline";
    status(`تعذر تحميل الرسائل (${e?.code || "unknown"}). راجع Firebase Realtime Database Rules.`, "error");
  });
}

async function ensureAuth() {
  await setPersistence(auth, browserLocalPersistence);
  if (auth.currentUser) return auth.currentUser;
  return (await signInAnonymously(auth)).user;
}

async function openChat() {
  if (opening) return;
  if (!myName) return nameScreen();
  opening = true;
  chatScreen();
  try {
    currentUser = await ensureAuth();
    $("connectionState").textContent = "متصل";
    $("connectionState").className = "online";
    status("", "hidden");
    subscribe();
  } catch(e) {
    $("connectionState").textContent = "غير متصل";
    $("connectionState").className = "offline";
    status(authError(e), "error");
  } finally {
    opening = false;
  }
}

async function sendMessage() {
  if (!currentUser) return status("انتظر حتى يتم الاتصال بالمحادثة.","error");
  const input = $("messageInput");
  const text = input.value.trim();
  if (!text && !selectedImage) return;

  const btn = document.querySelector(".send");
  btn.disabled = true;
  try {
    let image = null;
    if (selectedImage) {
      status("جاري رفع الصورة...","info");
      image = await uploadImgBB(selectedImage);
    }
    const messageRef = push(ref(db,CHAT_PATH));
    const payload = {
      senderId:currentUser.uid,
      senderName:myName,
      text:text.slice(0,2000),
      imageUrl:image?.url || "",
      displayUrl:image?.displayUrl || "",
      thumbnail:image?.thumbnail || "",
      createdAt:serverTimestamp()
    };
    if (replyingTo) {
      payload.replyTo = {
        messageId:replyingTo.messageId,
        senderName:replyingTo.senderName,
        text:replyingTo.text.slice(0,200)
      };
    }
    await set(messageRef,payload);
    input.value = "";
    clearImage();
    clearReply();
    status("","hidden");
    input.focus();
  } catch(e) {
    status(`فشل إرسال الرسالة: ${e?.message || "خطأ غير معروف"}`,"error");
  } finally {
    btn.disabled = false;
  }
}

onAuthStateChanged(auth, user => { currentUser = user || null; });
openChat();
</script>
</body>
</html>
