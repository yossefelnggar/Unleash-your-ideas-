<style>
:root{
  --bg:#f7f5f2; --ink:#14110f; --paper:#ffffff; --line:#14110f;
  --brand:#6c4dfb; --brand-ink:#ffffff; --accent:#00c48c; --warn:#ff8a3d; --danger:#ff4757;
  --muted:#726e68; --card:#ffffff; --soft:#efece6;
  --shadow: 4px 4px 0 var(--line);
  --shadow-sm: 2px 2px 0 var(--line);
}
[data-theme="dark"]{--bg:#131218;--ink:#f1f0f4;--paper:#1d1c24;--line:#f1f0f4;--brand:#9b7dff;--accent:#00e0a8;--warn:#ffab5c;--danger:#ff6b6f;--muted:#a5a1ad;--card:#1d1c24;--soft:#28262f;}
[data-theme="ocean"]{--bg:#eef7f9;--brand:#0891b2;--accent:#0ea5e9;--soft:#dcf0f4;--warn:#f59e0b;}
[data-theme="sunset"]{--bg:#fff4e9;--brand:#ff6b35;--accent:#ffb703;--soft:#ffe4cc;}
[data-theme="forest"]{--bg:#f2f8ee;--brand:#15803d;--accent:#84cc16;--soft:#e1eed6;}
[data-theme="rose"]{--bg:#fdf1f5;--brand:#e11d48;--accent:#fb7185;--soft:#fbdce4;}
[data-theme="dark"] .input,[data-theme="dark"] textarea,[data-theme="dark"] select{background:#26242e;color:#f1f0f4;}
[data-theme="dark"] .btn{color:var(--ink);}
[data-theme="dark"] .btn-brand,[data-theme="dark"] .btn-accent{color:#fff;}
[data-theme="dark"] img.avatar{background:#333;}
*{box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);margin:0;-webkit-tap-highlight-color:transparent;transition:background-color .2s ease;}
body,.card,.btn,.input,.pill,.badge,.modal-box{transition:background-color .2s ease, color .2s ease, border-color .2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#app{animation:fadeUp .25s ease;}
.theme-swatch.on{outline:3px solid var(--brand);outline-offset:2px;}
.modal-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:10px 10px 0;background:inherit;}
.modal-close span{cursor:pointer;width:30px;height:30px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;}
.skel{background:linear-gradient(90deg,var(--soft) 25%,#e2ded6 37%,var(--soft) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:12px;}
[data-theme="dark"] .skel{background:linear-gradient(90deg,#26242e 25%,#312f3b 37%,#26242e 63%);background-size:400% 100%;}
@keyframes skel{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.hidden{display:none !important;}
.brd{border:2.5px solid var(--line);}
.shadow-h{box-shadow:var(--shadow);}
.shadow-h-sm{box-shadow:var(--shadow-sm);}
.btn{border:2.5px solid var(--line);border-radius:14px;padding:10px 18px;font-weight:700;box-shadow:var(--shadow-sm);transition:transform .1s, box-shadow .1s;cursor:pointer;background:var(--paper);}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--line);}
.btn-brand{background:var(--brand);color:#fff;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-ghost{background:transparent;}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}
.input{border:2.5px solid var(--line);border-radius:12px;padding:10px 14px;width:100%;background:#fff;font-family:inherit;font-size:15px;}
.input:focus{outline:none;box-shadow:3px 3px 0 var(--brand);}
.badge{border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;display:inline-block;}
.tab-btn{padding:8px 16px;border-radius:12px;font-weight:700;cursor:pointer;border:2.5px solid transparent;}
.tab-btn.active{border-color:var(--line);background:var(--paper);box-shadow:var(--shadow-sm);}
.scrollx{overflow-x:auto;scrollbar-width:none;}
.scrollx::-webkit-scrollbar{display:none;}
.avatar{border:2.5px solid var(--line);border-radius:50%;object-fit:cover;background:#eee;}
.pill{border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;background:#fff;cursor:pointer;}
.pill.on{background:var(--ink);color:#fff;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#toastWrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px);}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:up .25s ease;}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.modal-bg{position:fixed;inset:0;background:rgba(20,17,15,.55);z-index:1000;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:768px){.modal-bg{align-items:center;}}
.modal-box{background:#fff;border:2.5px solid var(--line);border-radius:22px 22px 0 0;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;}
@media(min-width:768px){.modal-box{border-radius:22px;}}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2.5px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:500;}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);flex:1;padding:4px;cursor:pointer;}
.bn-item.active{color:var(--brand);}
.bn-item i{font-size:18px;}
.stagewrap{display:flex;gap:6px;flex-wrap:wrap;}
.loader-page{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:#ccc;border-radius:8px;}
@media(min-width:768px){.md-hide{display:none !important;}}
@media(max-width:767px){#app{padding-bottom:90px;}}
.unread-dot{width:9px;height:9px;background:var(--danger);border-radius:50%;border:1.5px solid #fff;position:absolute;top:-3px;left:-3px;}
.fab{position:fixed;z-index:600;width:46px;height:46px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-sm);font-size:19px;border:2.5px solid var(--line);}
#themeFab{bottom:80px;left:14px;}
@media(min-width:768px){#themeFab{bottom:20px;}}

.lightbox-bg img{max-width:92vw;max-height:92vh;border-radius:8px;}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

/* ===== VentureHub Core Upgrade ===== */
.msg-row{display:flex;gap:8px;align-items:flex-end;margin:2px 0;}

.msg-row.theirs{justify-content:flex-end;}

.msg-row.mine .msg-bubble{background:var(--brand);color:#fff;border-bottom-left-radius:5px;}
.msg-row.theirs .msg-bubble{background:var(--soft);border-bottom-right-radius:5px;}

.community-cover{min-height:130px;border:2.5px solid var(--line);border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--accent));overflow:hidden;}
.project-cover{width:100%;height:190px;object-fit:cover;border:2.5px solid var(--line);border-radius:16px;}
.project-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}

  .msg-list-mobile-hide{display:none!important;}

<script>
/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAAM11KB7jbdZC0EiPyOgIawxzGZITgMA8",
  authDomain: "flash-feedback-9c529.firebaseapp.com",
  databaseURL: "https://flash-feedback-9c529-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "flash-feedback-9c529",
  storageBucket: "flash-feedback-9c529.firebasestorage.app",
  messagingSenderId: "1026286586523",
  appId: "1:1026286586523:web:b76e33473c260fc4d7143e"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const IMGBB_KEY = "0dade31c18202a2a4fd8b847ab3ef9e1";
/* تنبيه: كل التحققات (isAdmin, إلخ) هنا في الواجهة فقط للتجربة، مش حماية حقيقية.
   لازم تتأكد إن قواعد Firebase Realtime Database Rules بتمنع أي مستخدم عادي من:
   - الكتابة في users/{uid}/isAdmin أو users/{uid}/founderScore مباشرة
   - الكتابة في opportunities/* إلا لو isAdmin=true على السيرفر
   بدون كده أي حد يقدر يفتح الكونسول ويغيّر بياناته بنفسه. */

/* ============ STATE ============ */
let currentUser = null;      // firebase auth user
let myProfile = null;        // profile record from /users/{uid}
let allUsersCache = {};
let allStartupsCache = {};
let route = {name:'landing', params:{}};
let feedUnsub = null, notifUnsub = null, msgListUnsub = null, convBadgeUnsub = null, activeMsgUnsub = null;

const ROLE_LABELS = {founder:'مؤسس',builder:'مطوّر/مصمم',mentor:'مرشد',investor:'مستثمر',organization:'منظمة',student:'طالب',customer:'عميل'};
const ROLE_ICONS = {founder:'🚀',builder:'👨‍💻',mentor:'🧠',investor:'💰',organization:'🏢',student:'🎓',customer:'🛍️'};
const STAGES = ['idea','validation','mvp','early_revenue','growth','fundraising'];
const STAGE_LABELS = {idea:'فكرة',validation:'تحقق',mvp:'MVP',early_revenue:'إيرادات مبكرة',growth:'نمو',fundraising:'تمويل'};
const OPP_CATS = {funding:'تمويل ومنح',programs:'حاضنات ومسرعات',competitions:'مسابقات وهاكاثونات',education:'منح تعليمية',jobs:'وظائف وتدريب'};
const ADMIN_EMAILS = []; // اختياري: أضف بريد الإدارة هنا. النشر في الفرص متاح للأعضاء المسجلين.

/* ============ HELPERS ============ */
function toast(msg,type='info'){
  const w=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className='toast';
  if(type==='error')t.style.background='#c0392b';
  if(type==='success')t.style.background='#1e8e5a';
  t.textContent=msg;
  w.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2600);
}
function esc(s){return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/* بيظهر رسالة خطأ واضحة + زر إعادة محاولة بدل ما القسم يفضل عالق على اللودينج للأبد */
function loadFail(elId,msg,retryFn){
  const el=document.getElementById(elId);
  if(!el)return;
  el.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--danger);">
    <i class="fa-solid fa-triangle-exclamation"></i> ${esc(msg||'تعذر تحميل البيانات، تأكد من اتصالك بالإنترنت')}
    ${retryFn?`<br><button class="btn" style="margin-top:10px;" onclick="${retryFn}">إعادة المحاولة</button>`:''}
  </div>`;
}
function timeAgo(ts){
  if(!ts)return'';
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return'الآن';
  if(s<3600)return Math.floor(s/60)+' د';
  if(s<86400)return Math.floor(s/3600)+' س';
  if(s<2592000)return Math.floor(s/86400)+' يوم';
  return new Date(ts).toLocaleDateString('ar-EG');
}
function uid(){return db.ref().push().key;}
async function addScore(targetUid,amount){
  if(!targetUid||!Number.isFinite(Number(amount))||Number(amount)<=0)return;
  try{
    await db.ref('users/'+targetUid+'/founderScore').transaction(v=>(Number(v)||0)+Number(amount));
    if(currentUser&&targetUid===currentUser.uid&&myProfile)myProfile.founderScore=(Number(myProfile.founderScore)||0)+Number(amount);
  }catch(e){ console.warn('Score update failed',e); }
}
function avatarUrl(u){return (u&&u.avatar)||'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent((u&&u.name)||'U')+'&backgroundColor=6c4dfb&textColor=ffffff';}
function compressImage(file,maxDim,quality){
  maxDim=maxDim||1280;quality=quality||0.72;
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith('image/')){resolve(file);return;}
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){
          if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
          else{w=Math.round(w*maxDim/h);h=maxDim;}
        }
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          if(!blob){resolve(file);return;}
          resolve(new File([blob],(file.name||'image').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}));
        },'image/jpeg',quality);
      };
      img.onerror=()=>resolve(file);
      img.src=e.target.result;
    };
    reader.onerror=()=>resolve(file);
    reader.readAsDataURL(file);
  });
}
async function uploadImage(file,onProgress){
  const compressed=await compressImage(file);
  const fd=new FormData();fd.append('image',compressed);
  const res=await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_KEY,{method:'POST',body:fd});
  const j=await res.json();
  if(j&&j.success)return j.data.url;
  throw new Error('upload failed');
}
function previewImageInto(inputEl,imgElId){
  const file=inputEl.files[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  const el=document.getElementById(imgElId);
  if(el){el.src=url;el.classList.remove('hidden');}
}

/* ============ THEMES (local device only) ============ */
const THEMES=[
  {id:'default',name:'الافتراضي',c1:'#6c4dfb',c2:'#f7f5f2'},
  {id:'dark',name:'داكن',c1:'#9b7dff',c2:'#131218'},
  {id:'ocean',name:'محيط',c1:'#0891b2',c2:'#eef7f9'},
  {id:'sunset',name:'غروب',c1:'#ff6b35',c2:'#fff4e9'},
  {id:'forest',name:'غابة',c1:'#15803d',c2:'#f2f8ee'},
  {id:'rose',name:'وردي',c1:'#e11d48',c2:'#fdf1f5'}
];
function applyTheme(id){
  try{localStorage.setItem('vh_theme',id);}catch(e){}
  document.documentElement.setAttribute('data-theme',id);
  document.querySelectorAll('.theme-swatch').forEach(s=>s.classList.toggle('on',s.dataset.theme===id));
  toast('تم تغيير الثيم — هيفضل محفوظ على جهازك بس','success');
}
function openThemePicker(){
  let current='default';
  try{current=localStorage.getItem('vh_theme')||'default';}catch(e){}

/* ============ AUTH ============ */
auth.onAuthStateChanged(async(user)=>{
  currentUser=user;
  stopRealtimeListeners();
  document.getElementById('loaderPage').classList.add('hidden');
  if(user){
    let snap;
    try{snap=await db.ref('users/'+user.uid).get();}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="card" style="margin:30px auto;max-width:700px;padding:24px;text-align:center;color:var(--danger);"><b>تعذر الاتصال بقاعدة البيانات</b><div style="margin-top:8px;color:var(--muted);">تأكد أن Realtime Database Rules الجديدة منشورة وأن Database URL هو نفسه الموجود في الملف.</div><button class="btn" style="margin-top:14px;" onclick="location.reload()">إعادة المحاولة</button></div>';return;}
    if(snap.exists()){
      myProfile=snap.val();
      document.getElementById('navbar').classList.remove('hidden');
      document.getElementById('bottomNav').classList.remove('hidden');
      document.getElementById('navAvatar').src=avatarUrl(myProfile);
      if(myProfile.isAdmin||ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((user.email||'').toLowerCase())){document.getElementById('adminTabBtn').classList.remove('hidden');}
      listenNotifications();
      listenConvBadge();
      go('feed');
    }else{
      go('onboarding');
    }
  }else{
    myProfile=null;
    document.getElementById('navbar').classList.add('hidden');
    document.getElementById('bottomNav').classList.add('hidden');
    go('landing');
  }
});

function doRegister(email,pass,name){
  return auth.createUserWithEmailAndPassword(email,pass).then(async cred=>{
    const emailNorm=(email||'').toLowerCase();
    const isConfiguredAdmin=ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(emailNorm);
    await db.ref('users/'+cred.user.uid).set({
      uid:cred.user.uid,name:name,email:email,role:'',bio:'',location:'',
      skills:[],avatar:'',availability:'available',founderScore:0,
      isAdmin:isConfiguredAdmin,createdAt:Date.now()
    });
  });
}
function doLogin(email,pass){return auth.signInWithEmailAndPassword(email,pass);}
function doLogout(){stopRealtimeListeners();auth.signOut();go('landing');}

function switchAccount(){stopRealtimeListeners();auth.signOut();go('auth');}
function resetPassword(){
  const email=(document.getElementById('afEmail')?.value||'').trim();
  if(!email){toast('اكتب بريدك الإلكتروني في الخانة فوق الأول','error');return;}
  auth.sendPasswordResetEmail(email).then(()=>toast('تم إرسال رابط إعادة تعيين كلمة المرور لبريدك','success')).catch(()=>toast('تعذر إرسال الرابط، تأكد من صحة البريد','error'));
}
async function loginWithGoogle(){
  const provider=new firebase.auth.GoogleAuthProvider();
  try{
    const cred=await auth.signInWithPopup(provider);
    const ref=db.ref('users/'+cred.user.uid);
    const snap=await ref.get();
    if(!snap.exists()){
      const email=(cred.user.email||'').toLowerCase();
      const isConfiguredAdmin=ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(email);
      await ref.set({uid:cred.user.uid,name:cred.user.displayName||'مستخدم جديد',email:cred.user.email||'',role:'',bio:'',location:'',skills:[],avatar:cred.user.photoURL||'',availability:'available',founderScore:0,isAdmin:isConfiguredAdmin,createdAt:Date.now()});
    }
  }catch(e){
    console.error(e);
    if(e.code!=='auth/popup-closed-by-user')toast('تعذر تسجيل الدخول بجوجل','error');
  }
}

function submitAuth(mode){
  const email=document.getElementById('afEmail').value.trim();
  const pass=document.getElementById('afPass').value;
  const errEl=document.getElementById('authErr');
  errEl.textContent='';
  if(!email||!pass){errEl.textContent='من فضلك أكمل البيانات';return;}
  if(mode==='register'){
    const name=document.getElementById('afName').value.trim();
    if(!name){errEl.textContent='من فضلك أدخل الاسم';return;}
    doRegister(email,pass,name).catch(e=>errEl.textContent=friendlyErr(e));
  }else{
    doLogin(email,pass).catch(e=>errEl.textContent=friendlyErr(e));
  }
}
function friendlyErr(e){
  const m=e.code||'';
  if(m.includes('email-already-in-use'))return'البريد الإلكتروني مستخدم بالفعل';
  if(m.includes('invalid-email'))return'بريد إلكتروني غير صالح';
  if(m.includes('weak-password'))return'كلمة المرور ضعيفة (6 أحرف على الأقل)';
  if(m.includes('user-not-found')||m.includes('wrong-password')||m.includes('invalid-credential'))return'بيانات الدخول غير صحيحة';
  return'حدث خطأ، حاول مرة أخرى';
}

      </div>`;
    }).join('')+`</div>`;
  }
  if(p.imageUrl){bodyExtra+=`<img src="${esc(p.imageUrl)}" style="width:100%;border-radius:12px;border:2px solid var(--line);margin-top:10px;max-height:340px;object-fit:cover;cursor:zoom-in;" onclick="event.stopPropagation();openLightbox('${p.imageUrl}')">`;}

function openReportModal(postId,communityId){

async function submitReport(postId,communityId){

  const btn=document.getElementById('reportSubmit');btn.disabled=true;btn.textContent='جارٍ الإرسال...';
  await db.ref('reports/'+uid()).set({postId,communityId:communityId||null,reporterId:currentUser.uid,reason,status:'open',createdAt:Date.now()});

async function toggleLike(postId,communityId){

  try{const x=await ref.get();if(x.exists())await ref.remove();else{await ref.set(true);const p=(await postRef(postId,communityId||null).get()).val();if(p&&p.authorId!==currentUser.uid)notify(p.authorId,'like','أعجب شخص بمنشورك');}}catch(e){console.error(e);toast('تعذر تسجيل الإعجاب','error');}
}
async function toggleSave(postId,communityId){

  try{const x=await ref.get();x.exists()?await ref.remove():await ref.set(true);}catch(e){console.error(e);toast('تعذر الحفظ','error');}
}
async function toggleCanHelp(postId,communityId){
  if(!requireAuth())return;const ref=postRef(postId,communityId||null).child('canHelp/'+currentUser.uid);

}
function openShareModal(postId){
  if(!requireAuth())return;
  openModal(`<div style="padding:0 18px 18px;">
    <h3 style="font-weight:800;font-size:17px;margin-bottom:12px;">إعادة نشر</h3>
    <textarea id="repostText" class="input" rows="2" placeholder="أضف تعليقك (اختياري)"></textarea>
    <button class="btn btn-brand" style="width:100%;margin-top:12px;" onclick="submitRepost('${postId}')"><i class="fa-solid fa-retweet"></i> إعادة نشر لمتابعيك</button>
  </div>`);
}
async function submitRepost(postId){
  const text=document.getElementById('repostText').value.trim();
  const orig=(await db.ref('posts/'+postId).get()).val();
  if(!orig){toast('المنشور غير موجود','error');return;}
  const originalAuthor=await fetchUserCached(orig.repostOf?orig.originalAuthorId||orig.authorId:orig.authorId);
  const rid=uid();
  await db.ref('posts/'+rid).set({
    authorId:currentUser.uid,type:'repost',text,repostOf:postId,
    originalAuthorId:orig.authorId,originalAuthorName:(allUsersCache[orig.authorId]||{}).name||'',
    originalAuthorAvatar:avatarUrl(allUsersCache[orig.authorId]||{}),
    originalText:orig.text||'',originalImageUrl:orig.imageUrl||'',
    createdAt:Date.now(),commentsCount:0
  });
  db.ref('posts/'+postId+'/repostCount').transaction(v=>(v||0)+1);
  if(orig.authorId!==currentUser.uid){notify(orig.authorId,'repost','أعاد شخص نشر منشورك');addScore(orig.authorId,2);}
  closeModal();toast('تم إعادة النشر','success');
}
function votePoll(postId,idx,communityId){

}

/* ---- comments ---- */
function openComments(postId,communityId){
  if(!requireAuth())return;
  openModal(`<div style="padding:16px;">
    <h3 style="font-weight:800;font-size:17px;margin-bottom:12px;">التعليقات</h3>
    <div id="commentsList" style="display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;"></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <input id="commentInput" class="input" placeholder="اكتب تعليق..." onkeydown="if(event.key==='Enter')submitComment('${postId}','${communityId||''}')">
      <button class="btn btn-brand" onclick="submitComment('${postId}','${communityId||''}')">إرسال</button>
    </div>
  </div>`);
  const path=communityId?('communityComments/'+communityId+'/'+postId):('comments/'+postId);
  db.ref(path).off();
  db.ref(path).orderByChild('createdAt').on('value',async snap=>{
    const arr=[];snap.forEach(c=>arr.push({id:c.key,...c.val()}));
    await Promise.all(arr.map(c=>fetchUserCached(c.authorId)));
    const el=document.getElementById('commentsList');if(!el)return;
    el.innerHTML=arr.length?arr.map(c=>{const a=allUsersCache[c.authorId]||{};return `<div style="display:flex;gap:8px;"><img class="avatar" style="width:30px;height:30px;" src="${avatarUrl(a)}"><div style="background:var(--soft);border-radius:12px;padding:8px 12px;flex:1;"><b style="font-size:13px;">${esc(a.name||'مستخدم')}</b><div style="font-size:14px;">${esc(c.text||'')}</div></div></div>`;}).join(''):'<div style="color:var(--muted);text-align:center;">لا توجد تعليقات بعد</div>';
  },err=>{console.error(err);const el=document.getElementById('commentsList');if(el)el.innerHTML='<div style="color:var(--danger);text-align:center;padding:20px;">تعذر تحميل التعليقات</div>';});
}
async function submitComment(postId,communityId){
  if(!requireAuth())return;
  const input=document.getElementById('commentInput');const text=(input?.value||'').trim();if(!text)return;
  try{
    const base=communityId?('communityComments/'+communityId+'/'+postId):('comments/'+postId);
    await db.ref(base+'/'+uid()).set({authorId:currentUser.uid,text,createdAt:Date.now()});
    await postRef(postId,communityId||null).child('commentsCount').transaction(v=>(Number(v)||0)+1);
    input.value='';
    const p=(await postRef(postId,communityId||null).get()).val();
    if(p&&p.authorId!==currentUser.uid)notify(p.authorId,'comment','علّق شخص على منشورك');
  }catch(e){console.error(e);toast('تعذر إرسال التعليق','error');}
}

    </div>`);

    document.getElementById('pollBox').classList.toggle('hidden',e.target.value!=='poll');

function addPollOpt(){
  const box=document.getElementById('pollBox');
  const inp=document.createElement('input');
  inp.className='input poll-opt';inp.placeholder='خيار آخر';
  box.insertBefore(inp,box.lastElementChild);
}
async function submitPost(){
  const type=document.getElementById('postType').value;
  const text=document.getElementById('postText').value.trim();
  if(!text){toast('اكتب نص المنشور','error');return;}
  const btn=document.getElementById('submitPostBtn');btn.disabled=true;btn.textContent='جارٍ النشر...';
  try{
    let imageUrl='';
    const file=document.getElementById('postImg').files[0];
    if(file)imageUrl=await uploadImage(file);
    let poll=null;
    if(type==='poll'){
      const opts=[...document.querySelectorAll('.poll-opt')].map(i=>i.value.trim()).filter(Boolean);
      if(opts.length>=2)poll={options:opts,votes:{}};
    }
    const pid=uid();
    await db.ref('posts/'+pid).set({authorId:currentUser.uid,type,text,imageUrl,poll,createdAt:Date.now(),commentsCount:0});
    addScore(currentUser.uid,3);
    closeModal();
    toast('تم النشر بنجاح','success');
  }catch(e){toast('حدث خطأ أثناء النشر','error');}
  btn.disabled=false;btn.textContent='نشر';
}

  card.innerHTML=`<div class="card" style="padding:16px;margin-top:14px;">
    <h3 style="font-weight:800;font-size:15px;margin-bottom:10px;">إعدادات الحساب</h3>

async function toggleFollow(targetUid,btn){
  if(!requireAuth()||!targetUid||targetUid===currentUser.uid)return;
  const ref=db.ref('follows/'+currentUser.uid+'/'+targetUid);
  try{
    const snap=await ref.get();

      await Promise.all([ref.remove(),db.ref('followers/'+targetUid+'/'+currentUser.uid).remove()]);
      btn.textContent='متابعة';btn.classList.add('btn-brand');

      btn.textContent='إلغاء المتابعة';btn.classList.remove('btn-brand');

}

function filterStartups(stage){
  document.querySelectorAll('#stageFilters .pill').forEach(p=>p.classList.toggle('on',p.dataset.stage===stage));
  loadStartups(stage);
}
function loadStartups(stage){
  const grid=document.getElementById('startupsGrid');
  grid.innerHTML='<div style="text-align:center;padding:20px;grid-column:1/-1;"><i class="fa-solid fa-spinner spin"></i></div>';
  db.ref('startups').orderByChild('createdAt').get().then(snap=>{
    let arr=[];snap.forEach(c=>arr.push({id:c.key,...c.val()}));
    arr.reverse();
    allStartupsCache={};arr.forEach(s=>allStartupsCache[s.id]=s);
    if(stage)arr=arr.filter(s=>s.stage===stage);
    grid.innerHTML=arr.length?arr.map(startupMiniCard).join(''):'<div class="card" style="padding:24px;text-align:center;color:var(--muted);grid-column:1/-1;">لا توجد مشاريع في هذه المرحلة</div>';
  }).catch(e=>{console.error(e);loadFail('startupsGrid','تعذر تحميل المشاريع الناشئة، تأكد من نشر قواعد Firebase',`loadStartups('${stage}')`);});
}

async function submitStartup(){
  const name=document.getElementById('stName').value.trim();
  if(!name){toast('اكتب اسم المشروع','error');return;}
  const btn=document.getElementById('stSubmit');btn.disabled=true;btn.textContent='جارٍ رفع بيانات المشروع...';
  try{
    const coverFile=document.getElementById('stCover')?.files?.[0];
    const galleryFiles=[...(document.getElementById('stGallery')?.files||[])].slice(0,4);
    let coverUrl='';
    if(coverFile)coverUrl=await uploadImage(coverFile);

    const gallery=[];
    for(const f of galleryFiles){
      gallery.push(await uploadImage(f));
    }

    const sid=uid();
    const data={
      founderId:currentUser.uid,
      name,
      industry:document.getElementById('stIndustry').value.trim(),
      stage:document.getElementById('stStage').value,
      problem:document.getElementById('stProblem').value.trim(),
      solution:document.getElementById('stSolution').value.trim(),
      product:document.getElementById('stProduct').value.trim(),
      lookingFor:document.getElementById('stLookingFor').value.split(',').map(s=>s.trim()).filter(Boolean),
      website:document.getElementById('stWebsite').value.trim(),
      demoUrl:document.getElementById('stDemo').value.trim(),
      pitchUrl:document.getElementById('stPitch').value.trim(),
      coverUrl,
      gallery,
      team:[{uid:currentUser.uid,role:'Founder'}],
      milestones:[],
      followers:{},
      createdAt:Date.now()
    };
    await db.ref('startups/'+sid).set(data);
    await db.ref('posts/'+uid()).set({
      authorId:currentUser.uid,
      type:'update',
      text:'🚀 أطلقت مشروعًا جديدًا: '+name,
      startupId:sid,
      createdAt:Date.now(),
      commentsCount:0
    });
    addScore(currentUser.uid,20);
    closeModal();toast('تم إطلاق المشروع بنجاح','success');
    go('startupDetail',{id:sid});
  }catch(e){
    console.error(e);
    toast('تعذر رفع المشروع. جرّب صورًا أقل أو أصغر حجمًا.','error');
  }finally{
    btn.disabled=false;btn.textContent='إطلاق المشروع';
  }
}

      team=team||[];

    });
    await reqRef.update({status:'accepted'});

    addScore(requesterUid,10);

/* ============ MESSAGES ============ */
/* فهرس عكسي: userConversations/{uid}/{convId}=true — عشان نقدر نجيب "محادثاتي" من غير ما نحتاج نفتش/نفلتر كل جدول المحادثات (وده اللي كان بيسبب فشل صامت في الصلاحيات). */
function directKey(a,b){return [a,b].sort().join('_');}

/* هل المحادثة فيها رسائل لسه ملهاش قراءة من المستخدم الحالي؟ */
function isConvUnread(c){
  if(!currentUser||!c)return false;
  if(c.lastSenderId===currentUser.uid)return false; // آخر رسالة أنا اللي بعتها
  const lastRead=(c.readBy&&c.readBy[currentUser.uid])||0;
  return (c.updatedAt||0)>lastRead;
}
/* سجّل إن المستخدم الحالي قرأ المحادثة دي لحد اللحظة دي */
function markConvRead(convId,ts){
  if(!currentUser||!convId)return;
  db.ref('conversations/'+convId+'/readBy/'+currentUser.uid).set(ts||Date.now());
}

/* يراقب فهرس محادثاتي + كل محادثة فيه لايف، وينده onChange كل ما حاجة تتغير */
function watchMyConversations(onChange){
  const idxRef=db.ref('userConversations/'+currentUser.uid);
  const state={};
  const itemUnsubs={};
  function emit(){onChange(Object.values(state));}
  const idxCb=idxRef.on('value',snap=>{
    const ids=snap.exists()?Object.keys(snap.val()):[];
    Object.keys(itemUnsubs).forEach(cid=>{
      if(!ids.includes(cid)){itemUnsubs[cid]();delete itemUnsubs[cid];delete state[cid];}
    });
    ids.forEach(cid=>{
      if(itemUnsubs[cid])return;
      const ref=db.ref('conversations/'+cid);
      const cb=ref.on('value',cSnap=>{
        if(!cSnap.exists()){delete state[cid];emit();return;}
        state[cid]={id:cid,...cSnap.val()};
        emit();
      },err=>console.warn('conv watch error',cid,err));
      itemUnsubs[cid]=()=>ref.off('value',cb);
    });
    if(!ids.length)emit();
  },err=>console.warn('userConversations watch error',err));
  return function unsub(){
    idxRef.off('value',idxCb);
    Object.values(itemUnsubs).forEach(fn=>fn());
  };
}

/* نقطة تنبيه صغيرة على أيقونة الرسائل لو فيه محادثة مقروءة لسه */
function listenConvBadge(){
  if(convBadgeUnsub)convBadgeUnsub();
  convBadgeUnsub=watchMyConversations(convs=>{
    const any=convs.some(isConvUnread);
    document.getElementById('bnMsgDot')?.classList.toggle('hidden',!any);
    document.getElementById('navMsgDot')?.classList.toggle('hidden',!any);
  });
}

async function loadConversations(){
  if(msgListUnsub)msgListUnsub();
  msgListUnsub=watchMyConversations(async arr=>{
    arr.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    await Promise.all(arr.map(async c=>{
      if(c.type==='group'){
        c.displayName=c.name||'جروب';
        c.otherId=null;
      }else{
        const otherId=Object.keys(c.members||{}).find(m=>m!==currentUser.uid);
        c.otherId=otherId;
        if(otherId)c.displayName=(await fetchUserCached(otherId)).name;
      }
    }));
    const list=document.getElementById('convItems');
    if(!list)return;
    list.innerHTML=arr.length?arr.map(c=>{
      const unread=isConvUnread(c);
      const icon=c.type==='group'?'👥':'💬';
      return `<div style="display:flex;gap:10px;padding:11px 8px;border-radius:12px;cursor:pointer;align-items:center;position:relative;" onclick="go('messages',{convId:'${c.id}'})">

          <div class="line-clamp-2" style="font-size:12px;color:${unread?'var(--ink)':'var(--muted)'};">${esc(c.lastMessage||'ابدأ المحادثة')}</div>
        </div>
      </div>`;
    }).join(''):'<div style="color:var(--muted);text-align:center;padding:24px;">لا توجد محادثات. ابدأ برسالة أو أنشئ جروب.</div>';
  });

        <div><div style="font-weight:900;">${esc(title)}</div><div style="font-size:11px;color:var(--muted);">${esc(subtitle)}</div></div>
      </div>
      <div id="msgBody" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px;"></div>
      <div style="display:flex;gap:8px;padding:10px;border-top:2.5px solid var(--line);">

        <button class="btn btn-brand" onclick="sendMessage('${convId}')"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>`;
    if(activeMsgUnsub){try{activeMsgUnsub();}catch(e){} activeMsgUnsub=null;}
    const msgRef=db.ref('messages/'+convId).orderByChild('createdAt');
    const msgCb=msgRef.on('value',async snap=>{
      const arr=[];snap.forEach(c=>arr.push({id:c.key,...c.val()}));
      await Promise.all(arr.map(m=>fetchUserCached(m.senderId)));
      const body=document.getElementById('msgBody');
      if(!body)return;
      body.innerHTML=arr.map(m=>{
        const mine=m.senderId===currentUser.uid;
        const sender=allUsersCache[m.senderId]||{};
        return `<div class="msg-row ${mine?'mine':'theirs'}">
          ${!mine?`<img class="avatar msg-avatar" src="${avatarUrl(sender)}">`:''}
          <div>
            ${c.type==='group'&&!mine?`<div style="font-size:11px;font-weight:800;margin:0 6px 2px;">${esc(sender.name||'مستخدم')}</div>`:''}
            <div class="msg-bubble">${esc(m.text||'')}</div>
            <div class="msg-meta" style="text-align:${mine?'left':'right'};">${mine?'أنت':esc(sender.name||'')} · ${timeAgo(m.createdAt)}</div>
          </div>
          ${mine?`<img class="avatar msg-avatar" src="${avatarUrl(myProfile)}">`:''}
        </div>`;
      }).join('')||'<div style="text-align:center;color:var(--muted);padding:30px;">ابدأ أول رسالة.</div>';
      body.scrollTop=body.scrollHeight;
      markConvRead(convId,Date.now());
    },err=>{console.error(err);const body=win.querySelector('#msgBody');if(body)body.innerHTML='<div style="text-align:center;color:var(--danger);padding:30px;">تعذر تحميل الرسائل</div>';});
    activeMsgUnsub=()=>msgRef.off('value',msgCb);
  }).catch(e=>{console.error(e);win.innerHTML='<div class="card" style="padding:30px;text-align:center;color:var(--danger);">تعذر فتح المحادثة</div>';});
}

async function startConversation(otherUid){
  if(!requireAuth())return;
  if(otherUid===currentUser.uid)return;
  try{
    const key=directKey(currentUser.uid,otherUid);
    const lookupSnap=await db.ref('directConvLookup/'+key).get();
    let convId=lookupSnap.exists()?lookupSnap.val():null;
    if(convId){
      const exists=(await db.ref('conversations/'+convId).get()).exists();
      if(!exists)convId=null;
      else {
        const c=await db.ref('conversations/'+convId).get();
        if(!c.child('members/'+currentUser.uid).exists()){convId=null;}
      }
    }
    if(!convId){
      convId=uid();
      const updates={};
      updates['conversations/'+convId]={
        type:'direct',
        members:{[currentUser.uid]:true,[otherUid]:true},
        lastMessage:'',
        updatedAt:Date.now()
      };
      updates['userConversations/'+currentUser.uid+'/'+convId]=true;
      updates['userConversations/'+otherUid+'/'+convId]=true;
      updates['directConvLookup/'+key]=convId;
      await db.ref().update(updates);
    }
    go('messages',{convId});
  }catch(e){
    console.error(e);
    toast('تعذر بدء المحادثة، حاول تاني','error');
  }
}

async function sendMessage(convId){
  if(!requireAuth()||!convId)return;
  const input=document.getElementById('msgInput');
  if(!input)return;
  const text=input.value.trim();
  if(!text)return;
  try{
    const convSnap=await db.ref('conversations/'+convId).get();
    const conv=convSnap.val();
    if(!conv||!conv.members||!conv.members[currentUser.uid]){toast('لا يمكنك إرسال رسالة هنا','error');return;}
    const now=Date.now();
    const mid=uid();
    await db.ref('messages/'+convId+'/'+mid).set({senderId:currentUser.uid,text,createdAt:now});
    await db.ref('conversations/'+convId).update({lastMessage:text,updatedAt:now,lastSenderId:currentUser.uid});
    markConvRead(convId,now);
    input.value='';
    Object.keys(conv.members||{}).filter(id=>id!==currentUser.uid).forEach(id=>notify(id,'message','أرسل لك شخص رسالة جديدة'));
  }catch(e){console.error(e);toast('تعذر إرسال الرسالة','error');}
}

function filterCommunities(q){
  q=(q||'').toLowerCase().trim();
  renderCommunityGrid(!q?communityCache:communityCache.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.topic||'').toLowerCase().includes(q)||(c.description||'').toLowerCase().includes(q)));

async function toggleCommunity(id,btn){
  if(!requireAuth())return;
  try{
    const ref=db.ref('communities/'+id+'/members/'+currentUser.uid);
    const snap=await ref.get();
    const delta=snap.exists()?-1:1;
    if(snap.exists())await ref.remove();else await ref.set(true);
    await db.ref('communities/'+id+'/membersCount').transaction(v=>Math.max(0,(Number(v)||0)+delta));
    btn.textContent=delta>0?'عضو بالفعل':'انضم للمجتمع';
    if(delta>0)btn.classList.remove('btn-brand');else btn.classList.add('btn-brand');
    loadCommunities();
  }catch(e){toast('تعذر تحديث عضويتك في المجتمع','error');}
}

/* ============ SEARCH ============ */
let searchTimer=null;
function liveSearch(q){
  clearTimeout(searchTimer);
  const drop=document.getElementById('searchDrop');
  if(!q||q.trim().length<2){drop.classList.add('hidden');return;}
  searchTimer=setTimeout(async()=>{
    const [usersSnap,startupsSnap]=await Promise.all([db.ref('users').get(),db.ref('startups').get()]);
    const users=[];usersSnap.forEach(c=>{const v=c.val();if(v.name&&v.name.toLowerCase().includes(q.toLowerCase()))users.push({id:c.key,...v});});
    const startups=[];startupsSnap.forEach(c=>{const v=c.val();if(v.name&&v.name.toLowerCase().includes(q.toLowerCase()))startups.push({id:c.key,...v});});
    drop.classList.remove('hidden');
    drop.innerHTML=(users.slice(0,4).map(u=>`<div style="display:flex;gap:8px;align-items:center;padding:8px;cursor:pointer;border-radius:8px;" onclick="go('profile',{uid:'${u.id}'})"><img class="avatar" style="width:28px;height:28px;" src="${avatarUrl(u)}"><span style="font-weight:700;font-size:13px;">${esc(u.name)}</span><span style="color:var(--muted);font-size:11px;">شخص</span></div>`).join(''))
      +(startups.slice(0,4).map(s=>`<div style="display:flex;gap:8px;align-items:center;padding:8px;cursor:pointer;border-radius:8px;" onclick="go('startupDetail',{id:'${s.id}'})"><span>🚀</span><span style="font-weight:700;font-size:13px;">${esc(s.name)}</span><span style="color:var(--muted);font-size:11px;">مشروع</span></div>`).join(''))
      || '<div style="padding:10px;color:var(--muted);font-size:13px;">لا توجد نتائج</div>';
  },300);
}
function renderSearchPage(app){app.innerHTML='';go('discover');}
function openMobileSearch(){
  openModal(`<div style="padding:16px;">
    <input id="mobileSearchInput" class="input" placeholder="ابحث عن أشخاص، مشاريع، فرص..." oninput="mobileLiveSearch(this.value)">
    <div id="mobileSearchResults" style="margin-top:12px;max-height:60vh;overflow-y:auto;"></div>
  </div>`);
  setTimeout(()=>document.getElementById('mobileSearchInput')?.focus(),150);
}
let mobileSearchTimer=null;
function mobileLiveSearch(q){
  clearTimeout(mobileSearchTimer);
  const res=document.getElementById('mobileSearchResults');
  if(!res)return;
  if(!q||q.trim().length<2){res.innerHTML='';return;}
  res.innerHTML='<div style="text-align:center;padding:10px;"><i class="fa-solid fa-spinner spin"></i></div>';
  mobileSearchTimer=setTimeout(async()=>{
    const [usersSnap,startupsSnap,oppsSnap]=await Promise.all([db.ref('users').get(),db.ref('startups').get(),db.ref('opportunities').get()]);
    const ql=q.toLowerCase();
    const users=[];usersSnap.forEach(c=>{const v=c.val();if(v.name&&v.name.toLowerCase().includes(ql))users.push({id:c.key,...v});});
    const startups=[];startupsSnap.forEach(c=>{const v=c.val();if(v.name&&v.name.toLowerCase().includes(ql))startups.push({id:c.key,...v});});
    const opps=[];oppsSnap.forEach(c=>{const v=c.val();if(v.title&&v.title.toLowerCase().includes(ql))opps.push({id:c.key,...v});});
    const rEl=document.getElementById('mobileSearchResults');
    if(!rEl)return;
    const html=(users.slice(0,6).map(u=>`<div style="display:flex;gap:10px;align-items:center;padding:10px;cursor:pointer;border-radius:10px;" onclick="closeModal();go('profile',{uid:'${u.id}'})"><img class="avatar" style="width:34px;height:34px;" src="${avatarUrl(u)}"><span style="font-weight:700;font-size:14px;">${esc(u.name)}</span><span style="color:var(--muted);font-size:12px;">شخص</span></div>`).join(''))
      +(startups.slice(0,6).map(s=>`<div style="display:flex;gap:10px;align-items:center;padding:10px;cursor:pointer;border-radius:10px;" onclick="closeModal();go('startupDetail',{id:'${s.id}'})"><span>🚀</span><span style="font-weight:700;font-size:14px;">${esc(s.name)}</span><span style="color:var(--muted);font-size:12px;">مشروع</span></div>`).join(''))
      +(opps.slice(0,6).map(o=>`<div style="display:flex;gap:10px;align-items:center;padding:10px;cursor:pointer;border-radius:10px;" onclick="closeModal();go('opportunityDetail',{id:'${o.id}'})"><span>💰</span><span style="font-weight:700;font-size:14px;">${esc(o.title)}</span><span style="color:var(--muted);font-size:12px;">فرصة</span></div>`).join(''));
    rEl.innerHTML=html||'<div style="padding:14px;color:var(--muted);text-align:center;">لا توجد نتائج</div>';
  },300);
}

/* ============ ADMIN ============ */
function renderAdmin(app){
  if(!myProfile||!(myProfile.isAdmin||ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((currentUser?.email||'').toLowerCase()))){
    app.innerHTML='<div class="card" style="padding:30px;text-align:center;">🚫 هذه الصفحة للإدارة فقط</div>';return;
  }
  app.innerHTML=`<h2 style="font-weight:900;font-size:20px;margin-bottom:14px;">⚙️ لوحة الإدارة</h2>
  <div id="adminStats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px;"></div>
  <div class="scrollx" style="display:flex;gap:8px;margin-bottom:14px;">
    <div class="tab-btn active" data-atab="users" onclick="adminTab('users')">المستخدمون</div>
    <div class="tab-btn" data-atab="opps" onclick="adminTab('opps')">الفرص</div>
    <div class="tab-btn" data-atab="startups" onclick="adminTab('startups')">المشاريع</div>
    <div class="tab-btn" data-atab="posts" onclick="adminTab('posts')">المنشورات</div>
    <div class="tab-btn" data-atab="reports" onclick="adminTab('reports')">🚩 البلاغات</div>
  </div>
  <div id="adminContent"></div>`;
  Promise.all([db.ref('users').get(),db.ref('posts').get(),db.ref('startups').get(),db.ref('opportunities').get()]).then(([u,p,s,o])=>{
    document.getElementById('adminStats').innerHTML=[
      ['المستخدمون',u.size||0,'👥'],['المنشورات',p.size||0,'📝'],['المشاريع',s.size||0,'🚀'],['الفرص',o.size||0,'💰']
    ].map(([l,v,i])=>`<div class="card" style="padding:14px;text-align:center;"><div style="font-size:20px;">${i}</div><div style="font-weight:900;font-size:18px;">${v}</div><div style="color:var(--muted);font-size:12px;">${l}</div></div>`).join('');
  }).catch(e=>{console.error(e);loadFail('adminStats','تعذر تحميل الإحصائيات',"go('admin')");});
  adminTab('users');
}
function adminTab(tab){
  document.querySelectorAll('[data-atab]').forEach(el=>el.classList.toggle('active',el.dataset.atab===tab));
  const c=document.getElementById('adminContent');
  c.innerHTML='<div style="text-align:center;padding:20px;"><i class="fa-solid fa-spinner spin"></i></div>';
  if(tab==='posts'){
    db.ref('posts').orderByChild('createdAt').limitToLast(50).get().then(async snap=>{
      const arr=[];snap.forEach(x=>arr.push({id:x.key,...x.val()}));
      arr.reverse();
      await Promise.all(arr.map(p=>fetchUserCached(p.authorId)));
      c.innerHTML=arr.length?arr.map(p=>{
        const a=allUsersCache[p.authorId]||{};
        return `<div class="card" style="padding:12px 16px;margin-bottom:8px;">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
            <img class="avatar" style="width:26px;height:26px;" src="${avatarUrl(a)}">
            <b style="font-size:13px;">${esc(a.name)}</b>
            <span style="color:var(--muted);font-size:11px;">${timeAgo(p.createdAt)}</span>
          </div>
          <div class="line-clamp-2" style="font-size:13px;color:#333;">${esc(p.text||'')}</div>
          <button class="btn" style="padding:5px 10px;font-size:11px;margin-top:8px;" onclick="adminDeletePost('${p.id}')">حذف المنشور</button>
        </div>`;
      }).join(''):'<div style="color:var(--muted);text-align:center;padding:20px;">لا توجد منشورات</div>';
    }).catch(e=>{console.error(e);loadFail('adminContent','تعذر تحميل المنشورات',"adminTab('posts')");});
  }else if(tab==='reports'){
    db.ref('reports').orderByChild('status').equalTo('open').get().then(async snap=>{
      const arr=[];snap.forEach(x=>arr.push({id:x.key,...x.val()}));
      arr.sort((a,b)=>b.createdAt-a.createdAt);
      await Promise.all(arr.map(r=>fetchUserCached(r.reporterId)));
      c.innerHTML=arr.length?arr.map(r=>{
        const rep=allUsersCache[r.reporterId]||{};
        return `<div class="card" style="padding:12px 16px;margin-bottom:8px;">
          <div style="font-size:12px;color:var(--muted);">بلاغ من <b>${esc(rep.name)}</b> · ${timeAgo(r.createdAt)}</div>
          <div style="font-size:13px;margin-top:4px;">${esc(r.reason)}</div>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn" style="padding:5px 10px;font-size:11px;" onclick="go('feed');closeModal&&closeModal();">عرض الفيد</button>
            <button class="btn" style="padding:5px 10px;font-size:11px;" onclick="adminDeletePost('${r.postId}');adminResolveReport('${r.id}')">حذف المنشور المُبلَّغ عنه</button>
            <button class="btn" style="padding:5px 10px;font-size:11px;" onclick="adminResolveReport('${r.id}')">تجاهل البلاغ</button>
          </div>
        </div>`;
      }).join(''):'<div style="color:var(--muted);text-align:center;padding:20px;">لا توجد بلاغات مفتوحة</div>';
    }).catch(e=>{console.error(e);loadFail('adminContent','تعذر تحميل البلاغات',"adminTab('reports')");});
  }else if(tab==='users'){
    db.ref('users').get().then(snap=>{
      const arr=[];snap.forEach(x=>arr.push({id:x.key,...x.val()}));
      c.innerHTML=arr.map(u=>`<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <img class="avatar" style="width:34px;height:34px;" src="${avatarUrl(u)}">
        <div style="flex:1;"><b>${esc(u.name)}</b> <span style="color:var(--muted);font-size:12px;">${esc(u.email||'')}</span></div>
        <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="toggleAdmin('${u.id}',${!u.isAdmin})">${u.isAdmin?'إزالة أدمن':'ترقية لأدمن'}</button>
      </div>`).join('');
    }).catch(e=>{console.error(e);loadFail('adminContent','تعذر تحميل المستخدمين',"adminTab('users')");});
  }else if(tab==='opps'){
    db.ref('opportunities').get().then(snap=>{
      const arr=[];snap.forEach(x=>arr.push({id:x.key,...x.val()}));
      c.innerHTML=`<button class="btn btn-brand" style="margin-bottom:10px;" onclick="openCreateOpportunity()">+ فرصة جديدة</button>`+
      (arr.length?arr.map(o=>`<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="flex:1;"><b>${esc(o.title)}</b></div>
        <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="deleteOpp('${o.id}')">حذف</button>
      </div>`).join(''):'<div style="color:var(--muted);text-align:center;padding:20px;">لا توجد فرص بعد</div>');
    }).catch(e=>{console.error(e);loadFail('adminContent','تعذر تحميل الفرص',"adminTab('opps')");});
  }else{
    db.ref('startups').get().then(snap=>{
      const arr=[];snap.forEach(x=>arr.push({id:x.key,...x.val()}));
      c.innerHTML=arr.length?arr.map(s=>`<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="flex:1;"><b>${esc(s.name)}</b></div>
        <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="deleteStartup('${s.id}')">حذف</button>
      </div>`).join(''):'<div style="color:var(--muted);text-align:center;padding:20px;">لا توجد مشاريع بعد</div>';
    }).catch(e=>{console.error(e);loadFail('adminContent','تعذر تحميل المشاريع',"adminTab('startups')");});
  }
}
async function toggleAdmin(uid,val){if(!myProfile?.isAdmin&&!ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((currentUser?.email||'').toLowerCase())){toast('غير مصرح','error');return;}try{await db.ref('users/'+uid+'/isAdmin').set(!!val);adminTab('users');}catch(e){toast('تعذر تحديث صلاحيات المستخدم','error');}}
async function deleteOpp(id){try{await db.ref('opportunities/'+id).remove();adminTab('opps');}catch(e){toast('تعذر حذف الفرصة','error');}}
async function deleteStartup(id){try{await db.ref('startups/'+id).remove();adminTab('startups');}catch(e){toast('تعذر حذف المشروع','error');}}
async function adminDeletePost(postId){try{await db.ref('posts/'+postId).remove();await db.ref('comments/'+postId).remove();toast('تم حذف المنشور','success');adminTab('posts');}catch(e){toast('تعذر حذف المنشور','error');}}
async function adminResolveReport(reportId){try{await db.ref('reports/'+reportId+'/status').set('resolved');toast('تم إغلاق البلاغ','success');adminTab('reports');}catch(e){toast('تعذر إغلاق البلاغ','error');}}

/* ============ MODAL HELPERS ============ */
function openModal(html,opts){
  opts=opts||{};
  const root=document.getElementById('modalRoot');
  const closeBtn=opts.noClose?'':'<div class="modal-close"><span onclick="closeModal()">✕</span></div>';
  root.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal-box">${closeBtn}${html}</div></div>`;
  document.addEventListener('keydown',escCloseModal);
  return root;
}
function escCloseModal(e){if(e.key==='Escape')closeModal();}
function closeModal(){document.getElementById('modalRoot').innerHTML='';document.removeEventListener('keydown',escCloseModal);}

/* responsive helper */
function updateResponsive(){
  const isMd=window.innerWidth>=768;
  document.querySelectorAll('.md-show').forEach(e=>e.style.display=isMd?'':'none');
}
window.addEventListener('resize',updateResponsive);
updateResponsive();

// Public diagnostics: افتح Console واكتب window.VentureHubDiagnostics() لمعرفة حالة Firebase/Auth/Database.
window.VentureHubDiagnostics=async function(){
  const result={firebase:!!window.firebase,authUser:auth.currentUser?auth.currentUser.uid:null,databaseURL:firebaseConfig.databaseURL,read:{users:null,posts:null,opportunities:null,conversations:null}};
  if(!auth.currentUser){console.table(result);return result;}
  const paths=['users/'+auth.currentUser.uid,'posts','opportunities','userConversations/'+auth.currentUser.uid];
  for(const path of paths){try{await db.ref(path).limitToLast(3).get(); result.read[path]=true;}catch(e){result.read[path]=e.code||e.message||false;}}
  console.table(result.read); return result;
};
