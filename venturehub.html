<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VentureHub | مجتمع ريادة الأعمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f7f5f2; --ink:#14110f; --paper:#ffffff; --line:#14110f;
  --brand:#6c4dfb; --brand-ink:#ffffff; --accent:#00c48c; --warn:#ff8a3d; --danger:#ff4757;
  --muted:#726e68; --card:#ffffff; --soft:#efece6;
  --shadow: 4px 4px 0 var(--line);
  --shadow-sm: 2px 2px 0 var(--line);
}
*{box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);margin:0;-webkit-tap-highlight-color:transparent;}
.hidden{display:none !important;}
.brd{border:2.5px solid var(--line);}
.shadow-h{box-shadow:var(--shadow);}
.shadow-h-sm{box-shadow:var(--shadow-sm);}
.btn{border:2.5px solid var(--line);border-radius:14px;padding:10px 18px;font-weight:700;box-shadow:var(--shadow-sm);transition:transform .1s, box-shadow .1s;cursor:pointer;background:var(--paper);}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--line);}
.btn-brand{background:var(--brand);color:#fff;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-ghost{background:transparent;}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}
.input{border:2.5px solid var(--line);border-radius:12px;padding:10px 14px;width:100%;background:#fff;font-family:inherit;font-size:15px;}
.input:focus{outline:none;box-shadow:3px 3px 0 var(--brand);}
.badge{border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;display:inline-block;}
.tab-btn{padding:8px 16px;border-radius:12px;font-weight:700;cursor:pointer;border:2.5px solid transparent;}
.tab-btn.active{border-color:var(--line);background:var(--paper);box-shadow:var(--shadow-sm);}
.scrollx{overflow-x:auto;scrollbar-width:none;}
.scrollx::-webkit-scrollbar{display:none;}
.avatar{border:2.5px solid var(--line);border-radius:50%;object-fit:cover;background:#eee;}
.pill{border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;background:#fff;cursor:pointer;}
.pill.on{background:var(--ink);color:#fff;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#toastWrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px);}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:up .25s ease;}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.modal-bg{position:fixed;inset:0;background:rgba(20,17,15,.55);z-index:1000;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:768px){.modal-bg{align-items:center;}}
.modal-box{background:#fff;border:2.5px solid var(--line);border-radius:22px 22px 0 0;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;}
@media(min-width:768px){.modal-box{border-radius:22px;}}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2.5px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:500;}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);flex:1;padding:4px;cursor:pointer;}
.bn-item.active{color:var(--brand);}
.bn-item i{font-size:18px;}
.stagewrap{display:flex;gap:6px;flex-wrap:wrap;}
.loader-page{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:#ccc;border-radius:8px;}
@media(min-width:768px){.md-hide{display:none !important;}}
@media(max-width:767px){#app{padding-bottom:90px;}}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
</style>
</head>
<body>

<div id="loaderPage" class="loader-page">
  <div style="width:56px;height:56px;border:5px solid var(--line);border-top-color:var(--brand);border-radius:50%;" class="spin"></div>
  <div style="font-weight:800;font-size:18px;">VentureHub</div>
</div>

<div id="toastWrap"></div>

<!-- ===== NAVBAR ===== -->
<div id="navbar" class="hidden" style="position:sticky;top:0;z-index:400;background:var(--bg);border-bottom:2.5px solid var(--line);">
  <div style="max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px;">
    <div style="display:flex;align-items:center;gap:8px;cursor:pointer;" onclick="go('feed')">
      <div style="width:34px;height:34px;background:var(--brand);border:2.5px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;">V</div>
      <div style="font-weight:900;font-size:18px;display:none;" class="md-show">VentureHub</div>
    </div>
    <div style="flex:1;max-width:420px;position:relative;" class="md-show">
      <input id="navSearch" class="input" placeholder="ابحث عن أشخاص، مشاريع، فرص..." style="padding-right:36px;" oninput="liveSearch(this.value)">
      <i class="fa-solid fa-magnifying-glass" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);"></i>
      <div id="searchDrop" class="hidden card" style="position:absolute;top:46px;left:0;right:0;padding:8px;max-height:400px;overflow-y:auto;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="btn btn-ghost md-show" onclick="openCreatePost()"><i class="fa-solid fa-pen"></i> منشور</button>
      <div style="position:relative;cursor:pointer;" onclick="go('notifications')">
        <i class="fa-solid fa-bell" style="font-size:20px;"></i>
        <span id="notifDot" class="hidden" style="position:absolute;top:-3px;left:-3px;width:9px;height:9px;background:var(--danger);border-radius:50%;border:1.5px solid #fff;"></span>
      </div>
      <img id="navAvatar" class="avatar" style="width:34px;height:34px;cursor:pointer;" onclick="go('profile',{uid:currentUser?.uid})">
    </div>
  </div>
  <div class="scrollx" style="max-width:1100px;margin:0 auto;padding:0 14px 8px;display:flex;gap:8px;">
    <div class="tab-btn" data-nav="feed" onclick="go('feed')">🏠 الفيد</div>
    <div class="tab-btn" data-nav="discover" onclick="go('discover')">🧭 اكتشف</div>
    <div class="tab-btn" data-nav="startups" onclick="go('startups')">🚀 المشاريع</div>
    <div class="tab-btn" data-nav="talent" onclick="go('talent')">👨‍💻 المواهب</div>
    <div class="tab-btn" data-nav="opportunities" onclick="go('opportunities')">💰 الفرص</div>
    <div class="tab-btn" data-nav="messages" onclick="go('messages')">💬 الرسائل</div>
    <div class="tab-btn" data-nav="leaderboard" onclick="go('leaderboard')">🏆 المتصدرين</div>
    <div id="adminTabBtn" class="tab-btn hidden" data-nav="admin" onclick="go('admin')">⚙️ الإدارة</div>
  </div>
</div>

<!-- ===== APP ROOT ===== -->
<div id="app" style="max-width:1100px;margin:0 auto;padding:14px 14px 90px;"></div>

<div class="bottom-nav md-hide hidden" id="bottomNav">
  <div class="bn-item" data-nav="feed" onclick="go('feed')"><i class="fa-solid fa-house"></i>الفيد</div>
  <div class="bn-item" data-nav="discover" onclick="go('discover')"><i class="fa-solid fa-compass"></i>اكتشف</div>
  <div class="bn-item" onclick="openCreatePost()"><i class="fa-solid fa-circle-plus" style="font-size:26px;color:var(--brand);"></i></div>
  <div class="bn-item" data-nav="messages" onclick="go('messages')"><i class="fa-solid fa-message"></i>رسائل</div>
  <div class="bn-item" data-nav="profile" onclick="go('profile',{uid:currentUser?.uid})"><i class="fa-solid fa-user"></i>حسابي</div>
</div>

<div id="modalRoot"></div>

<script>
/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAAM11KB7jbdZC0EiPyOgIawxzGZITgMA8",
  authDomain: "flash-feedback-9c529.firebaseapp.com",
  databaseURL: "https://flash-feedback-9c529-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "flash-feedback-9c529",
  storageBucket: "flash-feedback-9c529.firebasestorage.app",
  messagingSenderId: "1026286586523",
  appId: "1:1026286586523:web:b76e33473c260fc4d7143e"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const IMGBB_KEY = "0dade31c18202a2a4fd8b847ab3ef9e1";

/* ============ STATE ============ */
let currentUser = null;      // firebase auth user
let myProfile = null;        // profile record from /users/{uid}
let allUsersCache = {};
let allStartupsCache = {};
let route = {name:'landing', params:{}};
let feedUnsub = null, notifUnsub = null, msgListUnsub = null;

const ROLE_LABELS = {founder:'مؤسس',builder:'مطوّر/مصمم',mentor:'مرشد',investor:'مستثمر',organization:'منظمة',student:'طالب',customer:'عميل'};
const ROLE_ICONS = {founder:'🚀',builder:'👨‍💻',mentor:'🧠',investor:'💰',organization:'🏢',student:'🎓',customer:'🛍️'};
const STAGES = ['idea','validation','mvp','early_revenue','growth','fundraising'];
const STAGE_LABELS = {idea:'فكرة',validation:'تحقق',mvp:'MVP',early_revenue:'إيرادات مبكرة',growth:'نمو',fundraising:'تمويل'};
const OPP_CATS = {funding:'تمويل ومنح',programs:'حاضنات ومسرعات',competitions:'مسابقات وهاكاثونات',education:'منح تعليمية',jobs:'وظائف وتدريب'};
const ADMIN_EMAILS = []; // اتركها فاضية ليصبح أول مستخدم مسجل هو الأدمن تلقائيًا، أو ضيف إيميلك هنا

/* ============ HELPERS ============ */
function toast(msg,type='info'){
  const w=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className='toast';
  if(type==='error')t.style.background='#c0392b';
  if(type==='success')t.style.background='#1e8e5a';
  t.textContent=msg;
  w.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2600);
}
function esc(s){return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function timeAgo(ts){
  if(!ts)return'';
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return'الآن';
  if(s<3600)return Math.floor(s/60)+' د';
  if(s<86400)return Math.floor(s/3600)+' س';
  if(s<2592000)return Math.floor(s/86400)+' يوم';
  return new Date(ts).toLocaleDateString('ar-EG');
}
function uid(){return db.ref().push().key;}
function avatarUrl(u){return (u&&u.avatar)||'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent((u&&u.name)||'U')+'&backgroundColor=6c4dfb&textColor=ffffff';}
async function uploadImage(file){
  const fd=new FormData();fd.append('image',file);
  const res=await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_KEY,{method:'POST',body:fd});
  const j=await res.json();
  if(j&&j.success)return j.data.url;
  throw new Error('upload failed');
}
function go(name,params={}){
  route={name,params};
  document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===name));
  document.getElementById('searchDrop')?.classList.add('hidden');
  render();
  window.scrollTo(0,0);
}
function requireAuth(){
  if(!currentUser){go('auth');toast('سجّل دخولك أولًا');return false;}
  return true;
}

/* ============ AUTH ============ */
auth.onAuthStateChanged(async(user)=>{
  currentUser=user;
  document.getElementById('loaderPage').classList.add('hidden');
  if(user){
    const snap=await db.ref('users/'+user.uid).get();
    if(snap.exists()){
      myProfile=snap.val();
      document.getElementById('navbar').classList.remove('hidden');
      document.getElementById('bottomNav').classList.remove('hidden');
      document.getElementById('navAvatar').src=avatarUrl(myProfile);
      if(myProfile.isAdmin||ADMIN_EMAILS.includes(user.email)){document.getElementById('adminTabBtn').classList.remove('hidden');}
      listenNotifications();
      go('feed');
    }else{
      go('onboarding');
    }
  }else{
    myProfile=null;
    document.getElementById('navbar').classList.add('hidden');
    document.getElementById('bottomNav').classList.add('hidden');
    go('landing');
  }
});

function doRegister(email,pass,name){
  return auth.createUserWithEmailAndPassword(email,pass).then(async cred=>{
    const isFirst=(await db.ref('users').limitToFirst(1).get()).size===0? false:false;
    await db.ref('users/'+cred.user.uid).set({
      uid:cred.user.uid,name:name,email:email,role:'',bio:'',location:'',
      skills:[],avatar:'',availability:'available',founderScore:0,
      isAdmin:false,createdAt:Date.now()
    });
  });
}
function doLogin(email,pass){return auth.signInWithEmailAndPassword(email,pass);}
function doLogout(){auth.signOut();go('landing');}

/* ============ RENDER ROUTER ============ */
function render(){
  const app=document.getElementById('app');
  const r={
    landing:renderLanding, auth:renderAuth, onboarding:renderOnboarding,
    feed:renderFeed, discover:renderDiscover, profile:renderProfile,
    startups:renderStartups, startupDetail:renderStartupDetail, talent:renderTalent,
    opportunities:renderOpportunities, opportunityDetail:renderOpportunityDetail,
    messages:renderMessages, notifications:renderNotifications, leaderboard:renderLeaderboard,
    admin:renderAdmin, search:renderSearchPage
  };
  app.innerHTML='';
  (r[route.name]||renderLanding)(app);
}

/* ============ LANDING ============ */
function renderLanding(app){
  app.innerHTML=`
  <div style="padding:20px 0 10px;text-align:center;">
    <div style="display:inline-flex;align-items:center;gap:10px;margin-bottom:18px;">
      <div style="width:44px;height:44px;background:var(--brand);border:2.5px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;">V</div>
      <div style="font-weight:900;font-size:22px;">VentureHub</div>
    </div>
    <h1 style="font-size:34px;font-weight:900;line-height:1.4;margin:0 0 12px;">ابنِ مشروعك.<br>كوّن فريقك.<br><span style="color:var(--brand);">وابنِ مستقبلك.</span></h1>
    <p style="color:var(--muted);font-size:16px;max-width:480px;margin:0 auto 22px;">مجتمع عربي يجمع رواد الأعمال والمواهب والمرشدين والفرص في مكان واحد.</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-brand" style="font-size:16px;padding:12px 26px;" onclick="go('auth',{mode:'register'})">ابدأ مجانًا</button>
      <button class="btn" style="font-size:16px;padding:12px 26px;" onclick="go('auth',{mode:'login'})">تسجيل الدخول</button>
    </div>
  </div>
  <div class="scrollx" style="display:flex;gap:12px;margin:26px 0;padding-bottom:6px;">
    ${statCard('المؤسسين','12,500+','🚀')}${statCard('المشاريع','4,800+','💡')}${statCard('الفرص','1,200+','🎯')}${statCard('Mentors','650+','🧠')}
  </div>
  <div style="margin-top:10px;">
    <h2 style="font-weight:900;font-size:20px;margin-bottom:14px;">استكشف النظام البيئي</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;">
      ${ecoCard('🚀','Startups','مشاريع ناشئة تبحث عن فرق وفرص')}
      ${ecoCard('👨‍💻','Talent','مطورين ومصممين ومسوقين')}
      ${ecoCard('🧠','Mentors','خبرات تدعم رحلتك')}
      ${ecoCard('💰','Funding','منح ومستثمرين وحاضنات')}
      ${ecoCard('🏆','Competitions','مسابقات وهاكاثونات')}
      ${ecoCard('📚','Learning','مسارات تعلم ريادة الأعمال')}
    </div>
  </div>
  <div style="text-align:center;margin:40px 0 10px;">
    <button class="btn btn-brand" style="padding:12px 30px;font-size:16px;" onclick="go('auth',{mode:'register'})">انضم الآن مجانًا</button>
  </div>`;
}
function statCard(label,val,icon){return `<div class="card" style="min-width:130px;padding:16px;text-align:center;"><div style="font-size:22px;">${icon}</div><div style="font-weight:900;font-size:19px;margin-top:4px;">${val}</div><div style="color:var(--muted);font-size:12px;">${label}</div></div>`;}
function ecoCard(icon,title,desc){return `<div class="card" style="padding:18px;cursor:pointer;" onclick="go('auth',{mode:'register'})"><div style="font-size:26px;">${icon}</div><div style="font-weight:800;margin-top:8px;">${title}</div><div style="color:var(--muted);font-size:13px;margin-top:4px;">${desc}</div></div>`;
}

/* ============ AUTH VIEW ============ */
function renderAuth(app){
  const mode=route.params.mode||'login';
  app.innerHTML=`
  <div style="max-width:400px;margin:30px auto;">
    <div style="text-align:center;margin-bottom:20px;cursor:pointer;" onclick="go('landing')">
      <div style="display:inline-flex;align-items:center;gap:8px;">
        <div style="width:36px;height:36px;background:var(--brand);border:2.5px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;">V</div>
        <div style="font-weight:900;font-size:19px;">VentureHub</div>
      </div>
    </div>
    <div class="card" style="padding:22px;">
      <div style="display:flex;gap:8px;margin-bottom:18px;">
        <div class="tab-btn ${mode==='login'?'active':''}" style="flex:1;text-align:center;" onclick="go('auth',{mode:'login'})">تسجيل الدخول</div>
        <div class="tab-btn ${mode==='register'?'active':''}" style="flex:1;text-align:center;" onclick="go('auth',{mode:'register'})">حساب جديد</div>
      </div>
      <div id="authErr" style="color:var(--danger);font-size:13px;margin-bottom:8px;"></div>
      ${mode==='register'?'<input id="afName" class="input" placeholder="الاسم الكامل" style="margin-bottom:10px;">':''}
      <input id="afEmail" class="input" placeholder="البريد الإلكتروني" type="email" style="margin-bottom:10px;">
      <input id="afPass" class="input" placeholder="كلمة المرور" type="password" style="margin-bottom:14px;">
      <button class="btn btn-brand" style="width:100%;" onclick="submitAuth('${mode}')">${mode==='login'?'دخول':'إنشاء حساب'}</button>
    </div>
  </div>`;
}
function submitAuth(mode){
  const email=document.getElementById('afEmail').value.trim();
  const pass=document.getElementById('afPass').value;
  const errEl=document.getElementById('authErr');
  errEl.textContent='';
  if(!email||!pass){errEl.textContent='من فضلك أكمل البيانات';return;}
  if(mode==='register'){
    const name=document.getElementById('afName').value.trim();
    if(!name){errEl.textContent='من فضلك أدخل الاسم';return;}
    doRegister(email,pass,name).catch(e=>errEl.textContent=friendlyErr(e));
  }else{
    doLogin(email,pass).catch(e=>errEl.textContent=friendlyErr(e));
  }
}
function friendlyErr(e){
  const m=e.code||'';
  if(m.includes('email-already-in-use'))return'البريد الإلكتروني مستخدم بالفعل';
  if(m.includes('invalid-email'))return'بريد إلكتروني غير صالح';
  if(m.includes('weak-password'))return'كلمة المرور ضعيفة (6 أحرف على الأقل)';
  if(m.includes('user-not-found')||m.includes('wrong-password')||m.includes('invalid-credential'))return'بيانات الدخول غير صحيحة';
  return'حدث خطأ، حاول مرة أخرى';
}

/* ============ ONBOARDING ============ */
function renderOnboarding(app){
  app.innerHTML=`
  <div style="max-width:460px;margin:20px auto;">
    <h2 style="font-weight:900;font-size:22px;text-align:center;margin-bottom:6px;">أهلًا بيك 👋</h2>
    <p style="color:var(--muted);text-align:center;margin-bottom:20px;">اختر دورك في المجتمع علشان نظبطلك التجربة</p>
    <div id="roleGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      ${Object.entries(ROLE_LABELS).map(([k,v])=>`<div class="card" style="padding:16px;text-align:center;cursor:pointer;" onclick="selectRole('${k}')"><div style="font-size:24px;">${ROLE_ICONS[k]}</div><div style="font-weight:800;margin-top:6px;">${v}</div></div>`).join('')}
    </div>
  </div>`;
}
async function selectRole(role){

    </div>

function postTypeLabel(t){return {post:'📝 منشور',question:'❓ سؤال',build:'🏗️ بناء علني',opportunity:'🎯 فرصة',update:'📈 تحديث مشروع',poll:'📊 استطلاع'}[t]||t;}
function loadFeed(){
  if(feedUnsub)feedUnsub();
  const list=document.getElementById('feedList');
  if(!list)return;
  list.innerHTML='<div style="text-align:center;padding:30px;color:var(--muted);"><i class="fa-solid fa-spinner spin"></i></div>';
  feedUnsub=db.ref('posts').orderByChild('createdAt').limitToLast(50).on('value',async snap=>{
    const posts=[];
    snap.forEach(c=>posts.push({id:c.key,...c.val()}));
    posts.reverse();
    if(!posts.length){list.innerHTML='<div class="card" style="padding:30px;text-align:center;color:var(--muted);">لا توجد منشورات بعد. كن أول من ينشر!</div>';return;}
    const authorIds=[...new Set(posts.map(p=>p.authorId))];
    await Promise.all(authorIds.map(fetchUserCached));
    list.innerHTML=posts.map(renderPostCard).join('');
  });
}
async function fetchUserCached(id){
  if(allUsersCache[id])return allUsersCache[id];
  const s=await db.ref('users/'+id).get();
  allUsersCache[id]=s.exists()?s.val():{name:'مستخدم محذوف'};
  return allUsersCache[id];
}
function renderPostCard(p){
  const author=allUsersCache[p.authorId]||{name:'...'};
  const likeCount=p.likes?Object.keys(p.likes).length:0;
  const helpCount=p.canHelp?Object.keys(p.canHelp).length:0;
  const iLiked=currentUser&&p.likes&&p.likes[currentUser.uid];
  const iHelped=currentUser&&p.canHelp&&p.canHelp[currentUser.uid];
  const iSaved=currentUser&&p.saves&&p.saves[currentUser.uid];
  let bodyExtra='';
  if(p.type==='poll'&&p.poll){
    const total=Object.values(p.poll.votes||{}).length;
    bodyExtra='<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">'+p.poll.options.map((o,i)=>{
      const cnt=Object.values(p.poll.votes||{}).filter(v=>v===i).length;
      const pct=total?Math.round(cnt/total*100):0;
      return `<div class="brd" style="border-radius:10px;padding:8px 12px;position:relative;overflow:hidden;cursor:pointer;" onclick="votePoll('${p.id}',${i})">
        <div style="position:absolute;inset:0;background:#e9e4fb;width:${pct}%;z-index:0;"></div>
        <div style="position:relative;z-index:1;display:flex;justify-content:space-between;font-weight:700;font-size:14px;"><span>${esc(o)}</span><span>${pct}%</span></div>
      </div>`;
    }).join('')+`</div>`;
  }
  if(p.imageUrl){bodyExtra+=`<img src="${p.imageUrl}" style="width:100%;border-radius:12px;border:2px solid var(--line);margin-top:10px;max-height:340px;object-fit:cover;">`;}
  return `<div class="card" style="padding:16px;margin-bottom:12px;">
    <div style="display:flex;gap:10px;">
      <img class="avatar" style="width:42px;height:42px;cursor:pointer;" src="${avatarUrl(author)}" onclick="go('profile',{uid:'${p.authorId}'})">
      <div style="flex:1;">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span style="font-weight:800;cursor:pointer;" onclick="go('profile',{uid:'${p.authorId}'})">${esc(author.name)}</span>
          ${author.role?`<span class="badge" style="font-size:11px;padding:1px 8px;">${ROLE_ICONS[author.role]||''} ${ROLE_LABELS[author.role]||''}</span>`:''}
          <span style="color:var(--muted);font-size:12px;">· ${timeAgo(p.createdAt)}</span>
          <span class="badge" style="font-size:11px;background:var(--soft);">${postTypeLabel(p.type).split(' ')[0]}</span>
        </div>
        <div style="margin-top:6px;white-space:pre-wrap;line-height:1.7;">${esc(p.text)}</div>
        ${bodyExtra}
        <div style="display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;">
          <span onclick="toggleLike('${p.id}')" style="cursor:pointer;font-weight:700;font-size:13px;color:${iLiked?'var(--danger)':'var(--muted)'};"><i class="fa-${iLiked?'solid':'regular'} fa-heart"></i> ${likeCount}</span>
          <span onclick="openComments('${p.id}')" style="cursor:pointer;font-weight:700;font-size:13px;color:var(--muted);"><i class="fa-regular fa-comment"></i> ${p.commentsCount||0}</span>
          <span onclick="toggleSave('${p.id}')" style="cursor:pointer;font-weight:700;font-size:13px;color:${iSaved?'var(--brand)':'var(--muted)'};"><i class="fa-${iSaved?'solid':'regular'} fa-bookmark"></i></span>
          <span onclick="toggleCanHelp('${p.id}')" class="pill ${iHelped?'on':''}" style="font-size:12px;padding:3px 10px;">🤝 أقدر أساعد ${helpCount>0?'('+helpCount+')':''}</span>
        </div>
      </div>
    </div>
  </div>`;
}
function toggleLike(postId){
  if(!requireAuth())return;
  const ref=db.ref('posts/'+postId+'/likes/'+currentUser.uid);
  ref.get().then(s=>s.exists()?ref.remove():ref.set(true));
}
function toggleSave(postId){
  if(!requireAuth())return;
  const ref=db.ref('posts/'+postId+'/saves/'+currentUser.uid);
  ref.get().then(s=>s.exists()?ref.remove():ref.set(true));
}
function toggleCanHelp(postId){
  if(!requireAuth())return;
  const ref=db.ref('posts/'+postId+'/canHelp/'+currentUser.uid);
  ref.get().then(async s=>{
    if(s.exists()){ref.remove();}
    else{
      ref.set(true);
      const p=(await db.ref('posts/'+postId).get()).val();
      if(p && p.authorId!==currentUser.uid) notify(p.authorId,'canhelp','عرض شخص المساعدة في منشورك');
      toast('تم إرسال عرض المساعدة','success');
    }
  });
}
function votePoll(postId,idx){
  if(!requireAuth())return;
  db.ref('posts/'+postId+'/poll/votes/'+currentUser.uid).set(idx);
}

/* ---- comments ---- */
function openComments(postId){
  const modal=openModal(`
    <div style="padding:16px;">
      <h3 style="font-weight:800;font-size:17px;margin-bottom:12px;">التعليقات</h3>

function submitComment(postId){

  const cid=uid();

function openCreatePost(type){
  if(!requireAuth())return;
  type=type||'post';
  openModal(`
    <div style="padding:16px;">
      <h3 style="font-weight:800;font-size:17px;margin-bottom:10px;">منشور جديد</h3>

function addPollOpt(){
  const box=document.getElementById('pollBox');
  const inp=document.createElement('input');
  inp.className='input poll-opt';inp.placeholder='خيار آخر';
  box.insertBefore(inp,box.lastElementChild);

async function submitPost(){
  const type=document.getElementById('postType').value;
  const text=document.getElementById('postText').value.trim();
  if(!text){toast('اكتب نص المنشور','error');return;}
  const btn=document.getElementById('submitPostBtn');btn.disabled=true;btn.textContent='جارٍ النشر...';
  try{
    let imageUrl='';
    const file=document.getElementById('postImg').files[0];
    if(file)imageUrl=await uploadImage(file);
    let poll=null;
    if(type==='poll'){
      const opts=[...document.querySelectorAll('.poll-opt')].map(i=>i.value.trim()).filter(Boolean);
      if(opts.length>=2)poll={options:opts,votes:{}};
    }
    const pid=uid();
    await db.ref('posts/'+pid).set({authorId:currentUser.uid,type,text,imageUrl,poll,createdAt:Date.now(),commentsCount:0});
    closeModal();
    toast('تم النشر بنجاح','success');
  }catch(e){toast('حدث خطأ أثناء النشر','error');}
  btn.disabled=false;btn.textContent='نشر';
}

function loadStartups(stage){
  const grid=document.getElementById('startupsGrid');
  grid.innerHTML='<div style="text-align:center;padding:20px;grid-column:1/-1;"><i class="fa-solid fa-spinner spin"></i></div>';
  db.ref('startups').orderByChild('createdAt').get().then(snap=>{

    allStartupsCache={};arr.forEach(s=>allStartupsCache[s.id]=s);
    if(stage)arr=arr.filter(s=>s.stage===stage);
    grid.innerHTML=arr.length?arr.map(startupMiniCard).join(''):'<div class="card" style="padding:24px;text-align:center;color:var(--muted);grid-column:1/-1;">لا توجد مشاريع في هذه المرحلة</div>';

function renderMessages(app){
  if(!requireAuth())return;
  app.innerHTML=`
  <div style="display:grid;grid-template-columns:${route.params.convId?'1fr 2fr':'1fr'};gap:14px;" id="msgLayout">
    <div class="card" style="padding:10px;height:calc(100vh - 180px);overflow-y:auto;" id="convList"></div>

  loadConversations();

function loadConversations(){
  if(msgListUnsub)msgListUnsub();
  msgListUnsub=db.ref('conversations').orderByChild('members/'+currentUser.uid).equalTo(true).on('value',async snap=>{
    const arr=[];snap.forEach(c=>arr.push({id:c.key,...c.val()}));
    arr.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    await Promise.all(arr.map(c=>{
      const otherId=Object.keys(c.members).find(m=>m!==currentUser.uid);
      c.otherId=otherId;
      return fetchUserCached(otherId);
    }));
    const list=document.getElementById('convList');
    if(!list)return;
    list.innerHTML=arr.length?arr.map(c=>{
      const other=allUsersCache[c.otherId]||{};
      return `<div style="display:flex;gap:10px;padding:10px;border-radius:12px;cursor:pointer;align-items:center;" onmouseover="this.style.background='var(--soft)'" onmouseout="this.style.background=''" onclick="go('messages',{convId:'${c.id}'})">
        <img class="avatar" style="width:40px;height:40px;" src="${avatarUrl(other)}">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:800;font-size:14px;">${esc(other.name)}</div>
          <div class="line-clamp-2" style="font-size:12px;color:var(--muted);">${esc(c.lastMessage||'')}</div>
        </div>
      </div>`;
    }).join(''):'<div style="color:var(--muted);text-align:center;padding:20px;">لا توجد محادثات بعد</div>';
  });
}
async function startConversation(otherUid){
  if(!requireAuth())return;
  if(otherUid===currentUser.uid)return;
  const snap=await db.ref('conversations').orderByChild('members/'+currentUser.uid).equalTo(true).get();
  let convId=null;
  snap.forEach(c=>{if(c.val().members[otherUid])convId=c.key;});
  if(!convId){
    convId=uid();
    await db.ref('conversations/'+convId).set({members:{[currentUser.uid]:true,[otherUid]:true},lastMessage:'',updatedAt:Date.now()});
  }
  go('messages',{convId});
}
function openConversation(convId){
  document.getElementById('msgLayout').style.gridTemplateColumns='1fr 2fr';
  document.getElementById('convWindow').classList.remove('hidden');
  const win=document.getElementById('convWindow');
  win.innerHTML=`<div class="card" style="display:flex;flex-direction:column;height:calc(100vh - 180px);">
    <div id="msgBody" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;"></div>
    <div style="display:flex;gap:8px;padding:10px;border-top:2.5px solid var(--line);">
      <input id="msgInput" class="input" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendMessage('${convId}')">
      <button class="btn btn-brand" onclick="sendMessage('${convId}')"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>`;
  db.ref('messages/'+convId).orderByChild('createdAt').on('value',snap=>{
    const arr=[];snap.forEach(c=>arr.push(c.val()));
    const body=document.getElementById('msgBody');
    if(!body)return;
    body.innerHTML=arr.map(m=>{
      const mine=m.senderId===currentUser.uid;
      return `<div style="align-self:${mine?'flex-start':'flex-end'};background:${mine?'var(--brand)':'var(--soft)'};color:${mine?'#fff':'#000'};padding:8px 14px;border-radius:14px;max-width:75%;font-size:14px;">${esc(m.text)}</div>`;
    }).join('');
    body.scrollTop=body.scrollHeight;
  });
}
function sendMessage(convId){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text)return;
  db.ref('messages/'+convId+'/'+uid()).set({senderId:currentUser.uid,text,createdAt:Date.now()});
  db.ref('conversations/'+convId).update({lastMessage:text,updatedAt:Date.now()});
  input.value='';
}

  clearTimeout(searchTimer);
  const drop=document.getElementById('searchDrop');
  if(!q||q.trim().length<2){drop.classList.add('hidden');return;}
  searchTimer=setTimeout(async()=>{
    const [usersSnap,startupsSnap]=await Promise.all([db.ref('users').get(),db.ref('startups').get()]);
    const users=[];usersSnap.forEach(c=>{const v=c.val();if(v.name&&v.name.toLowerCase().includes(q.toLowerCase()))users.push({id:c.key,...v});});
    const startups=[];startupsSnap.forEach(c=>{const v=c.val();if(v.name&&v.name.toLowerCase().includes(q.toLowerCase()))startups.push({id:c.key,...v});});
    drop.classList.remove('hidden');
    drop.innerHTML=(users.slice(0,4).map(u=>`<div style="display:flex;gap:8px;align-items:center;padding:8px;cursor:pointer;border-radius:8px;" onclick="go('profile',{uid:'${u.id}'})"><img class="avatar" style="width:28px;height:28px;" src="${avatarUrl(u)}"><span style="font-weight:700;font-size:13px;">${esc(u.name)}</span><span style="color:var(--muted);font-size:11px;">شخص</span></div>`).join(''))

      || '<div style="padding:10px;color:var(--muted);font-size:13px;">لا توجد نتائج</div>';
  },300);
}

  if(!myProfile||!(myProfile.isAdmin||ADMIN_EMAILS.includes(currentUser?.email))){
    app.innerHTML='<div class="card" style="padding:30px;text-align:center;">🚫 هذه الصفحة للإدارة فقط</div>';return;
  }
  app.innerHTML=`<h2 style="font-weight:900;font-size:20px;margin-bottom:14px;">⚙️ لوحة الإدارة</h2>
  <div id="adminStats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px;"></div>
  <div style="display:flex;gap:8px;margin-bottom:14px;">
    <div class="tab-btn active" data-atab="users" onclick="adminTab('users')">المستخدمون</div>
    <div class="tab-btn" data-atab="opps" onclick="adminTab('opps')">الفرص</div>
    <div class="tab-btn" data-atab="startups" onclick="adminTab('startups')">المشاريع</div>
  </div>
  <div id="adminContent"></div>`;
  Promise.all([db.ref('users').get(),db.ref('posts').get(),db.ref('startups').get(),db.ref('opportunities').get()]).then(([u,p,s,o])=>{
    document.getElementById('adminStats').innerHTML=[
      ['المستخدمون',u.size||0,'👥'],['المنشورات',p.size||0,'📝'],['المشاريع',s.size||0,'🚀'],['الفرص',o.size||0,'💰']
    ].map(([l,v,i])=>`<div class="card" style="padding:14px;text-align:center;"><div style="font-size:20px;">${i}</div><div style="font-weight:900;font-size:18px;">${v}</div><div style="color:var(--muted);font-size:12px;">${l}</div></div>`).join('');
  });
  adminTab('users');
}
function adminTab(tab){
  document.querySelectorAll('[data-atab]').forEach(el=>el.classList.toggle('active',el.dataset.atab===tab));
  const c=document.getElementById('adminContent');
  if(tab==='users'){
    db.ref('users').get().then(snap=>{
      const arr=[];snap.forEach(x=>arr.push({id:x.key,...x.val()}));
      c.innerHTML=arr.map(u=>`<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <img class="avatar" style="width:34px;height:34px;" src="${avatarUrl(u)}">
        <div style="flex:1;"><b>${esc(u.name)}</b> <span style="color:var(--muted);font-size:12px;">${esc(u.email||'')}</span></div>
        <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="toggleAdmin('${u.id}',${!u.isAdmin})">${u.isAdmin?'إزالة أدمن':'ترقية لأدمن'}</button>
      </div>`).join('');
    });
  }else if(tab==='opps'){
    db.ref('opportunities').get().then(snap=>{
      const arr=[];snap.forEach(x=>arr.push({id:x.key,...x.val()}));
      c.innerHTML=`<button class="btn btn-brand" style="margin-bottom:10px;" onclick="openCreateOpportunity()">+ فرصة جديدة</button>`+
      arr.map(o=>`<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="flex:1;"><b>${esc(o.title)}</b></div>
        <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="deleteOpp('${o.id}')">حذف</button>
      </div>`).join('');
    });
  }else{
    db.ref('startups').get().then(snap=>{
      const arr=[];snap.forEach(x=>arr.push({id:x.key,...x.val()}));
      c.innerHTML=arr.map(s=>`<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="flex:1;"><b>${esc(s.name)}</b></div>
        <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="deleteStartup('${s.id}')">حذف</button>
      </div>`).join('');
    });
  }
}
function toggleAdmin(uid,val){db.ref('users/'+uid+'/isAdmin').set(val).then(()=>adminTab('users'));}
function deleteOpp(id){db.ref('opportunities/'+id).remove().then(()=>adminTab('opps'));}
function deleteStartup(id){db.ref('startups/'+id).remove().then(()=>adminTab('startups'));}

/* ============ MODAL HELPERS ============ */
function openModal(html){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal-box">${html}</div></div>`;
  return root;
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

/* responsive helper */
function updateResponsive(){
  const isMd=window.innerWidth>=768;
  document.querySelectorAll('.md-show').forEach(e=>e.style.display=isMd?'':'none');
}
window.addEventListener('resize',updateResponsive);
updateResponsive();
</script>
</body>
</html>
