<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Venture Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee;--paper:#fff;--ink:#171512;--muted:#77716a;--line:#171512;
  --brand:#6c4dfb;--soft:#eeeae3;--theirs:#eef0e3;--danger:#e5484d;--ok:#13a673;
  --shadow:3px 3px 0 var(--line);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column}

/* ---- name screen ---- */
.screen{height:100%;display:grid;place-items:center;padding:20px;overflow-y:auto}
.card{width:min(420px,100%);background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px}
.card .logo{width:46px;height:46px;border:2px solid var(--line);border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;margin-bottom:14px}
.card h1{margin:0 0 4px;font-size:20px}
.card .muted{color:var(--muted);font-size:13px;margin:0 0 18px}
.field{width:100%;border:2px solid var(--line);border-radius:13px;padding:12px 14px;margin:8px 0 16px;outline:none;background:#fff}
.field:focus{box-shadow:2px 2px 0 var(--brand)}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.primary{width:100%;border:2px solid var(--line);border-radius:13px;padding:12px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.primary:active{transform:translate(2px,2px);box-shadow:none}

/* ---- chat screen ---- */
.chat-card{width:100%;max-width:780px;margin:auto;display:flex;flex:1;flex-direction:column;height:100%;min-height:0;overflow:hidden}
.chat-header{flex:0 0 auto;z-index:20;background:rgba(245,243,238,.96);backdrop-filter:blur(10px);border-bottom:2px solid var(--line);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.person{display:flex;align-items:center;gap:10px}
.person h1{margin:0;font-size:15px}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--soft);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
#connectionState{font-size:11px;color:var(--muted)}
#connectionState.online{color:var(--ok)}
#connectionState.offline{color:var(--danger)}
.ghost{border:2px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.ghost:active{transform:translate(2px,2px);box-shadow:none}

.status{flex:0 0 auto;padding:9px 14px;font-size:12.5px;border-bottom:1px solid transparent}
.status.info{color:#725d1d;background:#fff9e8;border-bottom-color:#eee0ad}
.status.error{color:#9b1c1c;background:#fff1f1;border-bottom-color:#ffd7d7}

.messages{flex:1 1 auto;min-height:0;padding:16px 14px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:2px}
.empty{text-align:center;color:var(--muted);padding:60px 15px;font-size:13px}

.message-row{display:flex;margin:5px 0}
.message-row.mine{justify-content:flex-start}
.message-row.theirs{justify-content:flex-end}
.message{max-width:min(80%,540px);padding:9px 12px;border-radius:16px;background:var(--theirs);border:2px solid var(--line);box-shadow:1px 1px 0 rgba(0,0,0,.05)}
.message-row.mine .message{background:var(--brand);color:#fff;border-radius:16px 16px 5px 16px}
.message-row.theirs .message{border-radius:16px 16px 16px 5px}
.message-top{display:flex;gap:9px;align-items:baseline;margin-bottom:4px}
.sender{font-weight:800;font-size:11.5px}
.time{font-size:10px;color:var(--muted)}
.mine .time{color:rgba(255,255,255,.75)}
.message-text{font-size:14px;line-height:1.65;word-break:break-word;white-space:pre-wrap}
.message-image{display:block;max-width:100%;max-height:340px;border-radius:11px;margin-top:6px;border:2px solid var(--line);cursor:pointer}
.quoted{border-right:3px solid var(--brand);background:rgba(0,0,0,.06);padding:5px 8px;margin-bottom:6px;border-radius:6px;font-size:11.5px}
.mine .quoted{background:rgba(255,255,255,.18);border-right-color:#fff}
.quoted strong{display:block;font-size:11px}
.quoted span{display:block;color:inherit;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-btn{border:0;background:transparent;padding:4px 0 0;margin-top:2px;font-size:11px;cursor:pointer;color:var(--muted);font-weight:700}
.mine .reply-btn{color:rgba(255,255,255,.85)}

.reply-bar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;background:var(--soft);border-top:2px solid var(--line)}
.reply-bar strong{display:block;font-size:11px;color:var(--brand)}
.reply-bar span{display:block;font-size:12.5px;max-width:78vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-bar button{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}

.image-preview{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:2px solid var(--line);background:#fff}
.image-preview img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.image-preview button{border:2px solid var(--line);background:var(--soft);padding:6px 10px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700}

.composer{flex:0 0 auto;display:flex;align-items:flex-end;gap:7px;padding:9px 14px;background:rgba(255,255,255,.98);border-top:2px solid var(--line)}
.attach{height:44px;width:44px;border:2px solid var(--line);border-radius:13px;background:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;font-size:20px;box-shadow:2px 2px 0 var(--line)}
.attach:active{transform:translate(2px,2px);box-shadow:none}
#messageInput{flex:1;min-height:44px;max-height:120px;resize:none;border:2px solid var(--line);border-radius:14px;padding:11px 13px;outline:none;background:#fff}
#messageInput:focus{box-shadow:2px 2px 0 var(--brand)}
.send{height:44px;min-width:60px;border:2px solid var(--line);border-radius:13px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--line);flex:0 0 auto}
.send:active{transform:translate(2px,2px);box-shadow:none}
.send:disabled,.attach:disabled{opacity:.5;cursor:not-allowed}
.hint{flex:0 0 auto;text-align:center;font-size:10.5px;color:var(--muted);padding:6px 10px 10px}

#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast-item{background:var(--ink);color:#fff;border-radius:12px;padding:9px 16px;font-size:13px;box-shadow:var(--shadow);animation:toastIn .18s ease-out}
.toast-item.error{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

.lightbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}

@media(max-width:600px){.message{max-width:86%}.card{box-shadow:none;border:none}}

/* Venture Chat — modern WhatsApp-like UX */
:root{
  --bg:#efeae2;--paper:#fff;--ink:#111b21;--muted:#667781;
  --brand:#128c7e;--brand2:#25d366;--soft:#f0f2f5;
  --theirs:#fff;--mine:#d9fdd3;--line:#d8dfe3;
  --shadow:0 1px 2px rgba(0,0,0,.08);
}
body{background:#dfe5e8}
.chat-card{max-width:980px;background:var(--bg);box-shadow:0 0 22px rgba(0,0,0,.10)}
.chat-header{background:#f0f2f5;border-bottom:1px solid var(--line);padding:9px 14px}
.avatar{width:42px;height:42px;border:0;background:#dfe5e8;color:#128c7e}
.person h1{font-size:15px}

.ghost{background:transparent;padding:8px}
.messages{
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.18) 0 1px,transparent 1px 100%),
    radial-gradient(circle at 80% 70%,rgba(255,255,255,.16) 0 1px,transparent 1px 100%),
    var(--bg);
  background-size:36px 36px,52px 52px,auto;
  padding:18px 14px 12px;
}
.message-row{margin:3px 0}
.message{border:0;box-shadow:var(--shadow);padding:7px 9px 5px;border-radius:9px;position:relative;max-width:min(78%,540px)}
.message-row.mine .message{background:var(--mine);color:var(--ink);border-radius:9px 3px 9px 9px}
.message-row.theirs .message{background:var(--theirs);border-radius:3px 9px 9px 9px}
.message-top{margin-bottom:3px}
.sender{font-size:11px;color:#075e54}
.mine .sender{color:#075e54}
.time{font-size:9px;color:#667781}
.mine .time{color:#667781}
.message-text{font-size:14px;line-height:1.55}
.message-image{border:0;border-radius:8px;max-height:380px;margin-top:5px}
.reply-btn{opacity:0;position:absolute;top:3px;left:4px;background:rgba(255,255,255,.8);border-radius:50%;width:27px;height:27px;padding:0;font-size:0}
.message:hover .reply-btn,.message:focus-within .reply-btn{opacity:1}
.reply-btn::before{content:"↩";font-size:15px;color:#54656f}
.quoted{border-right:3px solid #128c7e;background:rgba(0,0,0,.045);margin-bottom:5px}
.mine .quoted{border-right-color:#128c7e;background:rgba(18,140,126,.08)}
.reply-bar{background:#f0f2f5;border-top:1px solid var(--line);padding:7px 12px}
.reply-bar strong{color:#128c7e}
.composer{gap:5px;padding:7px 9px;background:#f0f2f5;border-top:1px solid var(--line)}
.attach{height:44px;width:44px;border-radius:50%;font-size:21px;background:transparent;color:#54656f}
#messageInput{border:0;border-radius:22px;min-height:44px;padding:11px 15px;background:#fff;box-shadow:none}
#messageInput:focus{box-shadow:none}
.send{height:44px;min-width:44px;width:44px;border-radius:50%;background:#128c7e;font-size:0}
.send::after{content:"➤";font-size:18px;color:#fff}
.hint{display:none}
.image-preview{border-top:1px solid var(--line);background:#f0f2f5}
@media(max-width:600px){
  .chat-card{max-width:none;box-shadow:none}
  .message{max-width:86%}
  .message .reply-btn{opacity:1}
}

</style>

<style>

function esc(v = "") {
  return String(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function timeOf(v) {
  if (!v) return "";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "" :
    d.toLocaleTimeString("ar-EG", {hour:"2-digit", minute:"2-digit"});
}

function status(msg, type="info") {
  const e = $("status");
  if (!e) return;
  if (!msg) { e.className = "status hidden"; e.textContent = ""; return; }
  e.textContent = msg;
  e.className = `status ${type}`;
}

function toast(msg, type="info") {
  const box = $("toast");
  if (!box) return;
  const el = document.createElement("div");
  el.className = `toast-item ${type === "error" ? "error" : ""}`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

  if (e?.code === "auth/operation-not-allowed")

async function compressImage(file, maxWidth=1600, quality=.82) {
  if (!file || typeof file !== "object") {
    throw new Error("لم يتم اختيار ملف.");
  }

  if (!file.type || !file.type.startsWith("image/")) {
    throw new Error("الملف المختار ليس صورة.");
  }

  if (file.size > 15 * 1024 * 1024) {
    throw new Error("حجم الصورة أكبر من 15MB.");
  }

  // طريقة أكثر توافقًا مع متصفحات الهاتف:
  // نستخدم Object URL بدل FileReader لقراءة الصورة.
  const objectUrl = URL.createObjectURL(file);

  try {
    const img = new Image();
    img.decoding = "async";
    img.src = objectUrl;

    // decode() أسرع وأكثر ثباتًا على المتصفحات الحديثة،
    // مع fallback إلى onload للمتصفحات التي لا تدعمه.
    if (typeof img.decode === "function") {
      try {
        await img.decode();
      } catch {
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error("تعذر فتح الصورة على الهاتف."));
        });
      }
    } else {
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error("تعذر فتح الصورة على الهاتف."));
      });
    }

    if (!img.naturalWidth || !img.naturalHeight) {
      throw new Error("تعذر قراءة أبعاد الصورة.");
    }

    const ratio = Math.min(1, maxWidth / img.naturalWidth);
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.naturalWidth * ratio));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * ratio));

    const ctx = canvas.getContext("2d", { alpha: false });
    if (!ctx) throw new Error("المتصفح لا يدعم معالجة الصور.");

    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    const blob = await new Promise((resolve, reject) => {
      canvas.toBlob(
        b => b ? resolve(b) : reject(new Error("فشل تحويل الصورة.")),
        "image/jpeg",
        quality
      );
    });

    return blob;
  } finally {
    URL.revokeObjectURL(objectUrl);
  }
}

async function uploadImgBB(file) {
  const blob = await compressImage(file);
  const b64 = await new Promise((resolve,reject) => {
    const r = new FileReader();
    r.onloadend = () => resolve(String(r.result).split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
  const f = new FormData();
  f.append("image", b64);
  let res;
  try {
    res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
      method:"POST",
      body:f
    });
  } catch (networkErr) {
    throw new Error("تعذر الاتصال بخدمة رفع الصور ImgBB. تحقق من الإنترنت أو جرّب شبكة أخرى.");
  }
  const data = await res.json().catch(() => null);
  if (!res.ok || !data?.success)
    throw new Error(data?.error?.message || "فشل رفع الصورة.");
  return {
    url:data.data.url,
    displayUrl:data.data.display_url || data.data.url,
    thumbnail:data.data.thumb?.url || data.data.url
  };
}

async function selectImage(e) {
  const file = e.target.files?.[0];

  if (!file) {
    clearImage();
    return;
  }

  try {

    selectedImage = file;

    const previewBlob = await compressImage(file, 900, .8);
    const previewUrl = URL.createObjectURL(previewBlob);

    const preview = $("previewImg");
    if (preview) {
      if (preview.dataset.objectUrl) {
        URL.revokeObjectURL(preview.dataset.objectUrl);
      }
      preview.dataset.objectUrl = previewUrl;
      preview.src = previewUrl;
    }

    $("imagePreview").classList.remove("hidden");
  } catch(err) {
    selectedImage = null;
    e.target.value = "";
    toast(err?.message || "تعذر قراءة الصورة.", "error");
  }
}

function renderMessages(snapshot) {
  const box = $("messages");
  if (!box) return;

  const rows = [];
  snapshot.forEach(child => {
    const value = child.val();
    if (value && typeof value === "object") {
      rows.push({ id: child.key, ...value });
    }
  });

  // Firebase قد يرجع createdAt كـ null أثناء serverTimestamp الأولي.
  // نحافظ على ترتيب Firebase بدل الاعتماد على createdAt.
  if (!rows.length) {
    box.innerHTML = `<div class="empty">لا توجد رسائل بعد. ابدأ المحادثة!</div>`;
    return;
}

  const nearBottom =
    box.scrollHeight - box.scrollTop - box.clientHeight < 150;

  const fragment = document.createDocumentFragment();

  rows.forEach(m => {
    try {
      const mine = String(m.senderId || "") === String(currentUser?.uid || "");
      const article = document.createElement("article");
      article.className = `message-row ${mine ? "mine" : "theirs"}`;

      const message = document.createElement("div");
      message.className = "message";

      const top = document.createElement("div");
      top.className = "message-top";

      const sender = document.createElement("span");
      sender.className = "sender";
      sender.textContent = m.senderName || "مستخدم";

      const time = document.createElement("span");
      time.className = "time";
      time.textContent = timeOf(m.createdAt);

      top.append(sender, time);
      message.appendChild(top);

      if (m.replyTo) {
        const quoted = document.createElement("div");
        quoted.className = "quoted";

        const strong = document.createElement("strong");
        strong.textContent = m.replyTo.senderName || "مستخدم";

        const span = document.createElement("span");
        span.textContent = m.replyTo.text || "صورة";

        quoted.append(strong, span);
        message.appendChild(quoted);
      }

      if (m.text) {
        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = m.text;
        message.appendChild(text);
      }

      if (m.audioUrl) {
        const voice = document.createElement("div");
        voice.className = "voice-message";
        const play = document.createElement("button");
        play.className = "voice-play"; play.type = "button"; play.textContent = "▶";
        const audio = new Audio(m.audioUrl);
        const wave = document.createElement("div"); wave.className = "voice-wave";
        const duration = document.createElement("span"); duration.className = "voice-duration";
        duration.textContent = `${m.audioDuration || 1}s`;
        play.onclick = () => { if(audio.paused){audio.play();play.textContent="Ⅱ"}else{audio.pause();play.textContent="▶"} };
        audio.onended = () => play.textContent="▶";
        voice.append(play,wave,duration);
        message.appendChild(voice);
      }

      if (m.imageUrl) {
        const img = document.createElement("img");
        img.className = "message-image";
        img.src = m.displayUrl || m.imageUrl;
        img.alt = "صورة";
        img.loading = "lazy";
        img.dataset.full = m.imageUrl;
        img.onclick = () => openLightbox(m.imageUrl);
        message.appendChild(img);
      }

      const replyBtn = document.createElement("button");
      replyBtn.className = "reply-btn";
      replyBtn.type = "button";
      replyBtn.textContent = "↩ رد";
      replyBtn.onclick = () => setReply(m);

      message.appendChild(replyBtn);

      const actions = document.createElement("div");
      actions.className = "message-actions";
      const react = document.createElement("button");
      react.className = "message-action"; react.type="button"; react.textContent="☺";
      react.title="تفاعل";
      react.onclick=()=>toggleReactionPicker(m.id,react);
      actions.appendChild(react);

      if (m.reactions && typeof m.reactions === "object") {
        const grouped = {};
        Object.values(m.reactions).forEach(r => {
          if(r?.emoji) grouped[r.emoji]=(grouped[r.emoji]||0)+1;
        });
        const reactions = document.createElement("div");
        reactions.className="reactions";
        Object.entries(grouped).forEach(([emoji,count])=>{
          const rb=document.createElement("button");
          rb.className="reaction"; rb.type="button"; rb.textContent=`${emoji} ${count}`;
          rb.onclick=()=>addReaction(m.id,emoji);
          reactions.appendChild(rb);
        });
        actions.appendChild(reactions);
      }
      message.appendChild(actions);
      article.appendChild(message);
      fragment.appendChild(article);

    } catch (rowErr) {
    }
  });

  box.replaceChildren(fragment);

  // إعادة تسجيل تفاصيل العدد الحقيقي المعروض.
  const renderedCount = box.querySelectorAll(".message-row").length;

  if (nearBottom || forceScrollNext) {
    box.scrollTop = box.scrollHeight;
    forceScrollNext = false;
  }
}

function subscribe() {
  if (unsubscribeMessages) unsubscribeMessages();
  const q = query(ref(db,CHAT_PATH),limitToLast(200));
  let firstLoad = true;
  unsubscribeMessages = onValue(q, snapshot => {
    try {
      renderMessages(snapshot);
    } catch(renderErr) {
      toast(`خطأ في عرض الرسائل: ${renderErr?.message || renderErr}`, "error");
      status(`خطأ في عرض الرسائل: ${renderErr?.message || renderErr}`, "error");
      console.error("renderMessages crashed:", renderErr);
    }
    firstLoad = false;
  }, e => {
    $("connectionState").textContent = "تعذر الاتصال";
    $("connectionState").className = "offline";
    status(`تعذر تحميل الرسائل (${e?.code || "unknown"}). راجع Firebase Realtime Database Rules.`, "error");
  });

  // مؤشر حقيقي لحالة الاتصال اللحظي (WebSocket) بفايربيز — مستقل عن نجاح تسجيل الدخول
  onValue(ref(db,".info/connected"), snap => {
    const el = $("connectionState");
    if (!el) return;
    if (snap.val() === true) {
      el.textContent = "متصل";
      el.className = "online";
    } else if (!firstLoad) {
      el.textContent = "انقطع الاتصال اللحظي - جاري إعادة المحاولة...";
      el.className = "offline";
    }
  });
}

let mediaRecorder=null, audioChunks=[], recordingStream=null, recordingStart=0;

async function toggleVoiceRecording(){
  if(mediaRecorder && mediaRecorder.state==="recording"){
    mediaRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices?.getUserMedia){
    toast("المتصفح لا يدعم تسجيل الصوت.","error"); return;
  }
  try{
    recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
      ? "audio/webm;codecs=opus" : "audio/webm";
    mediaRecorder=new MediaRecorder(recordingStream,{mimeType:mime});
    audioChunks=[];
    recordingStart=Date.now();
    const form=$("messageForm");
    form.querySelector("#voiceBtn").textContent="■";
    form.querySelector("#voiceBtn").style.color="#e5484d";
    mediaRecorder.ondataavailable=e=>{ if(e.data.size) audioChunks.push(e.data); };
    mediaRecorder.onstop=async()=>{
      recordingStream?.getTracks().forEach(t=>t.stop());
      const blob=new Blob(audioChunks,{type:mime});
      const duration=Math.max(1,Math.round((Date.now()-recordingStart)/1000));
      mediaRecorder=null; audioChunks=[];
      form.querySelector("#voiceBtn").textContent="🎙";
      form.querySelector("#voiceBtn").style.color="";
      await sendVoiceMessage(blob,duration);
    };
    mediaRecorder.start();
    toast("جاري تسجيل الرسالة الصوتية… اضغط الميكروفون للإرسال");
  }catch(e){
    toast("تعذر الوصول إلى الميكروفون. اسمح للموقع باستخدامه.","error");
  }
}

async function sendVoiceMessage(blob,duration){
  if(!currentUser) return;
  const input=$("messageInput");
  const btn=$("voiceBtn"); if(btn) btn.disabled=true;
  try{
    // Store a local object URL for immediate playback. For persistence across devices,
    // the production version should upload audio to dedicated object storage.
    const localUrl=URL.createObjectURL(blob);
    const messageRef=push(ref(db,CHAT_PATH));
    await set(messageRef,{
      senderId:currentUser.uid,senderName:myName,text:"",
      audioUrl:localUrl,audioDuration:duration,createdAt:serverTimestamp()
    });
    forceScrollNext=true;
  }catch(e){
    toast("فشل إرسال الرسالة الصوتية.","error");
  }finally{
    if(btn) btn.disabled=false;
  }
}



// =====================
// WebRTC 1:1 Calls
// Firebase Realtime Database is used as the signaling channel.
// =====================
const CALLS_PATH = "chats/private-chat/calls";
const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" }
];

let rtcPeer = null;
let rtcLocalStream = null;
let rtcRemoteStream = null;
let rtcCallId = null;
let rtcCallType = null;
let rtcUnsubs = [];
let rtcMuted = false;
let rtcCameraOff = false;

function cleanupRtcListeners(){
  rtcUnsubs.forEach(fn=>{try{fn()}catch{}});
  rtcUnsubs=[];
}

function stopRtc(){
  cleanupRtcListeners();
  if(rtcPeer){try{rtcPeer.onicecandidate=null;rtcPeer.close()}catch{}}
  rtcPeer=null;
  rtcLocalStream?.getTracks().forEach(t=>t.stop());
  rtcLocalStream=null;
  rtcRemoteStream=null;
  rtcCallId=null;
  rtcCallType=null;
  rtcMuted=false;
  rtcCameraOff=false;
  document.querySelector(".webrtc-overlay")?.remove();
}

function createRtcPeer(callId, type){
  rtcPeer = new RTCPeerConnection({iceServers:ICE_SERVERS});
  rtcRemoteStream = new MediaStream();
  const remote = document.getElementById("remoteVideo");
  if(remote) remote.srcObject=rtcRemoteStream;

  rtcPeer.ontrack = e => {
    e.streams[0]?.getTracks().forEach(track=>rtcRemoteStream.addTrack(track));
    const audio=document.getElementById("remoteAudio");
    if(audio) audio.srcObject=rtcRemoteStream;
  };

  rtcPeer.onicecandidate = async e => {
    if(!e.candidate || !rtcCallId) return;
    const candidate = e.candidate.toJSON();
    const side = type==="caller" ? "callerCandidates" : "calleeCandidates";
    await set(push(ref(db,`${CALLS_PATH}/${callId}/${side}`)), candidate);
  };

  rtcPeer.onconnectionstatechange = () => {
    const state=rtcPeer?.connectionState;
    const el=document.getElementById("rtcStatus");
    if(el){
      el.textContent =
        state==="connected" ? "متصل" :
        state==="connecting" ? "جاري الاتصال…" :
        state==="failed" ? "تعذر إنشاء الاتصال" :
        state==="disconnected" ? "انقطع الاتصال مؤقتًا" : "جاري الاتصال…";
    }
    if(state==="failed" || state==="closed") setTimeout(stopRtc,1200);
  };
  return rtcPeer;
}

async function getRtcMedia(type){
  if(!navigator.mediaDevices?.getUserMedia)
    throw new Error("المتصفح لا يدعم مكالمات WebRTC.");
  return navigator.mediaDevices.getUserMedia(
    type==="video" ? {audio:true,video:{facingMode:"user"}} : {audio:true,video:false}
  );
}

function callOverlay(type, remoteName, incoming=false){
  document.querySelector(".webrtc-overlay")?.remove();
  const overlay=document.createElement("div");
  overlay.className="webrtc-overlay";
  overlay.innerHTML=`
    <div class="webrtc-top">
      <div class="webrtc-title">
        <strong>${type==="video"?"مكالمة فيديو":"مكالمة صوتية"}</strong>
        <span id="rtcStatus">${incoming?"مكالمة واردة":"جاري الاتصال…"}</span>
      </div>
      <button id="rtcCloseTop" class="webrtc-control" type="button">×</button>
    </div>
    <div class="webrtc-stage">
      ${type==="video"
        ? `<video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video>`
        : `<div class="audio-call-avatar">${esc((remoteName||"م").charAt(0).toUpperCase())}</div><audio id="remoteAudio" autoplay></audio>`}
      ${incoming?`
      <div class="webrtc-incoming">
        <div class="webrtc-incoming-card">
          <div class="incoming-avatar">${esc((remoteName||"م").charAt(0).toUpperCase())}</div>
          <h2>${esc(remoteName||"مستخدم")}</h2>
          <p>${type==="video"?"مكالمة فيديو واردة":"مكالمة صوتية واردة"}</p>
          <div class="incoming-actions">
            <button id="acceptCall" class="accept" type="button">☎</button>
            <button id="declineCall" class="decline" type="button">✕</button>
          </div>
        </div>
      </div>`:""}
    </div>
    ${incoming?"":`
    <div class="webrtc-controls">
      <button id="muteRtc" class="webrtc-control" type="button">🎙</button>
      ${type==="video"?'<button id="cameraRtc" class="webrtc-control" type="button">▣</button>':""}
      <button id="hangupRtc" class="webrtc-control hangup" type="button">☎</button>
    </div>`}
  `;
  document.body.appendChild(overlay);

  overlay.querySelector("#rtcCloseTop").onclick=()=>endCall("ended");
  if(!incoming){
    overlay.querySelector("#hangupRtc").onclick=()=>endCall("ended");
    overlay.querySelector("#muteRtc").onclick=toggleRtcMute;
    overlay.querySelector("#cameraRtc")?.addEventListener("click",toggleRtcCamera);
  }
  return overlay;
}

async function startCall(type){
  if(!currentUser) return toast("انتظر حتى يتم الاتصال.","error");
  if(!window.RTCPeerConnection) return toast("WebRTC غير مدعوم في هذا المتصفح.","error");
  try{
    rtcCallType=type;
    rtcCallId=push(ref(db,CALLS_PATH)).key;
    callOverlay(type,"المستخدم الآخر",false);
    rtcLocalStream=await getRtcMedia(type);
    if(type==="video"){
      const v=document.getElementById("localVideo"); if(v) v.srcObject=rtcLocalStream;
    }
    createRtcPeer(rtcCallId,"caller");
    rtcLocalStream.getTracks().forEach(t=>rtcPeer.addTrack(t,rtcLocalStream));

    const callRef=ref(db,`${CALLS_PATH}/${rtcCallId}`);
    await set(callRef,{
      callerId:currentUser.uid,callerName:myName,
      type,status:"ringing",createdAt:serverTimestamp()
    });

    const offer=await rtcPeer.createOffer();
    await rtcPeer.setLocalDescription(offer);
    await update(callRef,{offer:{type:offer.type,sdp:offer.sdp}});

    rtcUnsubs.push(onValue(ref(db,`${CALLS_PATH}/${rtcCallId}/calleeCandidates`),snap=>{
      snap.forEach(c=>rtcPeer?.addIceCandidate(new RTCIceCandidate(c.val())).catch(()=>{}));
    }));
    rtcUnsubs.push(onValue(ref(db,`${CALLS_PATH}/${rtcCallId}/answer`),async snap=>{
      const a=snap.val();
      if(a && rtcPeer && !rtcPeer.currentRemoteDescription){
        await rtcPeer.setRemoteDescription(new RTCSessionDescription(a));
      }
    }));
    rtcUnsubs.push(onValue(callRef,snap=>{
      const c=snap.val();
      if(!c || c.status==="ended" || c.status==="declined") stopRtc();
    }));
  }catch(e){
    toast("تعذر بدء المكالمة. تأكد من صلاحية الميكروفون/الكاميرا.","error");
    stopRtc();
  }
}

async function acceptCall(callId, call){
  try{
    rtcCallId=callId; rtcCallType=call.type;
    callOverlay(call.type,call.callerName||"مستخدم",false);
    rtcLocalStream=await getRtcMedia(call.type);
    if(call.type==="video"){
      const v=document.getElementById("localVideo"); if(v) v.srcObject=rtcLocalStream;
    }
    createRtcPeer(callId,"callee");
    rtcLocalStream.getTracks().forEach(t=>rtcPeer.addTrack(t,rtcLocalStream));

    await rtcPeer.setRemoteDescription(new RTCSessionDescription(call.offer));
    const answer=await rtcPeer.createAnswer();
    await rtcPeer.setLocalDescription(answer);
    await update(ref(db,`${CALLS_PATH}/${callId}`),{
      answer:{type:answer.type,sdp:answer.sdp},status:"accepted"
    });

    rtcUnsubs.push(onValue(ref(db,`${CALLS_PATH}/${callId}/callerCandidates`),snap=>{
      snap.forEach(c=>rtcPeer?.addIceCandidate(new RTCIceCandidate(c.val())).catch(()=>{}));
    }));
    rtcUnsubs.push(onValue(ref(db,`${CALLS_PATH}/${callId}`),snap=>{
      const c=snap.val();
      if(!c || c.status==="ended") stopRtc();
    }));
  }catch(e){
    toast("تعذر قبول المكالمة.","error");
    await endCall("declined");
  }
}

async function endCall(status="ended"){
  if(rtcCallId){
    try{await update(ref(db,`${CALLS_PATH}/${rtcCallId}`),{status})}catch{}
  }
  stopRtc();
}

function toggleRtcMute(){
  rtcMuted=!rtcMuted;
  rtcLocalStream?.getAudioTracks().forEach(t=>t.enabled=!rtcMuted);
  const b=document.getElementById("muteRtc");
  if(b) b.classList.toggle("active",rtcMuted);
}
function toggleRtcCamera(){
  rtcCameraOff=!rtcCameraOff;
  rtcLocalStream?.getVideoTracks().forEach(t=>t.enabled=!rtcCameraOff);
  const b=document.getElementById("cameraRtc");
  if(b) b.classList.toggle("active",rtcCameraOff);
}

function listenForIncomingCalls(){
  const callsRef=ref(db,CALLS_PATH);
  const stop=onValue(query(callsRef,limitToLast(20)),snap=>{
    snap.forEach(child=>{
      const c=child.val(), id=child.key;
      if(!c || c.calleeId || c.callerId===currentUser?.uid) return;
      if(c.status==="ringing" && c.offer && !rtcCallId){
        // Claim the call atomically enough for a simple 1:1 room.
        update(ref(db,`${CALLS_PATH}/${id}`),{calleeId:currentUser.uid,calleeName:myName}).catch(()=>{});
        rtcCallId=id; rtcCallType=c.type;
        const overlay=callOverlay(c.type,c.callerName||"مستخدم",true);
        overlay.querySelector("#acceptCall").onclick=()=>acceptCall(id,c);
        overlay.querySelector("#declineCall").onclick=()=>endCall("declined");
      }
    });
  });
  rtcUnsubs.push(stop);
}


function openRooms(){
  const modal=document.createElement("div");
  modal.className="call-modal";
  modal.innerHTML=`<div class="call-card" style="padding:18px">
    <div class="call-head"><strong>الغرف</strong><span>اختر مساحة محادثة</span></div>
    <button id="mainRoom" class="primary" style="margin-top:10px">💬 الغرفة العامة</button>
    <button id="newRoom" class="ghost" style="width:100%;margin-top:10px">＋ إنشاء غرفة مخصصة</button>
    <button id="closeRooms" class="ghost" style="width:100%;margin-top:10px">إغلاق</button>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector("#closeRooms").onclick=()=>modal.remove();
  modal.querySelector("#mainRoom").onclick=()=>modal.remove();
  modal.querySelector("#newRoom").onclick=()=>{
    const name=prompt("اسم الغرفة:");
    if(name?.trim()) toast(`تم تجهيز الغرفة «${name.trim().slice(0,40)}»`);
    modal.remove();
  };
}

function openCall(type){
  const modal=document.createElement("div");
  modal.className="call-modal";
  modal.innerHTML=`
    <div class="call-card">
      ${type==="video"?'<video id="callPreview" class="call-video" autoplay muted playsinline></video>':''}
      <div class="call-head"><strong>${type==="video"?"مكالمة فيديو":"مكالمة صوتية"}</strong><span>واجهة المكالمة جاهزة</span></div>
      <div class="call-controls">
        <button id="muteCall" type="button">🎙</button>
        ${type==="video"?'<button id="cameraCall" type="button">▣</button>':''}
        <button id="hangupCall" class="hangup" type="button">☎</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  let stream=null;
  const finish=()=>{
    stream?.getTracks().forEach(t=>t.stop());
    modal.remove();
  };
  modal.querySelector("#hangupCall").onclick=finish;
  (async()=>{
    try{
      stream=await navigator.mediaDevices.getUserMedia(
        type==="video"?{audio:true,video:true}:{audio:true}
      );
      const video=modal.querySelector("#callPreview");
      if(video) video.srcObject=stream;
    }catch(e){
      toast("لم يتم السماح بالميكروفون/الكاميرا.","error");
    }
  })();
}

async function sendMessage() {
  if (!currentUser) return status("انتظر حتى يتم الاتصال بالمحادثة.","error");
  const input = $("messageInput");
  const text = input.value.trim();
  if (!text && !selectedImage) return;

  const btn = document.querySelector(".send");
  const attachBtn = document.querySelector(".attach");
  btn.disabled = true;
  if (attachBtn) attachBtn.setAttribute("aria-disabled","true");
  try {
    let image = null;
    if (selectedImage) {
      status("جاري رفع الصورة...","info");
      try {
        image = await uploadImgBB(selectedImage);
      } catch(imgErr) {
        throw new Error(`فشل رفع الصورة: ${imgErr?.message || "تحقق من الإنترنت أو حاول بصورة أصغر"}`);
      }
    }
    const messageRef = push(ref(db,CHAT_PATH));
    const payload = {
      senderId:currentUser.uid,
      senderName:myName,
      text:text.slice(0,2000),
      imageUrl:image?.url || "",
      displayUrl:image?.displayUrl || "",
      thumbnail:image?.thumbnail || "",
      createdAt:serverTimestamp()
    };
    if (replyingTo) {
      payload.replyTo = {
        messageId:replyingTo.messageId,
        senderName:replyingTo.senderName,
        text:replyingTo.text.slice(0,200)
      };
    }
    await set(messageRef,payload);
    input.value = "";
    input.style.height = "auto";
    clearImage();
    clearReply();
    status("");
    forceScrollNext = true;
    input.focus();
  } catch(e) {
    let reason = e?.message || "خطأ غير معروف";
    if (e?.code === "PERMISSION_DENIED" || /permission/i.test(reason))
      reason = "الصلاحيات (Firebase Rules) بترفض الكتابة. راجع Realtime Database Rules.";
    status(`فشل إرسال الرسالة: ${reason}`,"error");
    toast(`فشل الإرسال: ${reason}`,"error");
  } finally {
    btn.disabled = false;
  }
}

onAuthStateChanged(auth, user => { currentUser = user || null; });
openChat();
</script>
