<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>الدردشة الخاصة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --bg:#f5f3ee;--paper:#fff;--ink:#171512;--muted:#77716a;--line:#171512;
  --brand:#6c4dfb;--soft:#eeeae3;--mine:#6c4dfb;--danger:#e5484d;--ok:#13a673;
  --shadow:3px 3px 0 var(--line);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}
.hidden{display:none!important}
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,243,238,.96);backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.topbar-inner{max-width:820px;margin:auto;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900}
.logo{width:38px;height:38px;border:2px solid var(--line);border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900}
.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chat{width:100%;max-width:820px;margin:auto;display:flex;flex:1;flex-direction:column}
.messages{flex:1;padding:18px 14px 120px;overflow-y:auto}
.message{display:flex;gap:8px;margin:0 0 12px;align-items:flex-end}
.message.mine{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--soft);object-fit:cover;flex:0 0 auto}
.message-content{max-width:min(78%,600px)}
.bubble{border:2px solid var(--line);background:var(--paper);border-radius:17px 17px 17px 5px;padding:9px 13px;line-height:1.65;word-break:break-word;box-shadow:1px 1px 0 rgba(0,0,0,.05)}
.mine .bubble{background:var(--mine);color:#fff;border-radius:17px 17px 5px 17px}
.meta{font-size:10px;color:var(--muted);margin:3px 5px 0}
.mine .meta{text-align:right}
.image{display:block;max-width:100%;max-height:420px;border-radius:12px;border:2px solid var(--line);margin-bottom:6px;cursor:pointer}
.composer-wrap{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:2px solid var(--line);padding:9px max(12px,calc((100vw - 820px)/2 + 12px)) calc(9px + env(safe-area-inset-bottom))}
.composer{display:flex;align-items:flex-end;gap:7px}
.text{flex:1;min-height:44px;max-height:120px;resize:none;border:2px solid var(--line);border-radius:14px;padding:10px 12px;outline:none;background:#fff}
.text:focus{box-shadow:2px 2px 0 var(--brand)}
.icon-btn,.send{height:44px;min-width:44px;border:2px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.send{background:var(--brand);color:#fff}
.icon-btn:active,.send:active{transform:translate(2px,2px);box-shadow:none}
.icon-btn:disabled,.send:disabled{opacity:.5;cursor:not-allowed}
.preview{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.preview img{width:58px;height:58px;object-fit:cover;border:2px solid var(--line);border-radius:10px}
.preview button{border:0;background:var(--soft);width:30px;height:30px;border-radius:50%;cursor:pointer}
.screen{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(440px,100%);background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px}
.field{width:100%;border:2px solid var(--line);border-radius:13px;padding:12px 14px;margin:8px 0 14px;outline:none}
.field:focus{box-shadow:2px 2px 0 var(--brand)}
.primary{width:100%;border:2px solid var(--line);border-radius:13px;padding:12px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.note{color:var(--muted);font-size:12px;line-height:1.8}
.empty{text-align:center;color:var(--muted);padding:60px 15px}
.typing{font-size:11px;color:var(--muted);padding:0 8px 5px}
.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);z-index:100;background:var(--ink);color:#fff;border-radius:12px;padding:9px 14px;font-size:13px;box-shadow:var(--shadow)}
.toast.error{background:var(--danger)}
.preview-label{font-size:11px;color:var(--muted)}
@media(max-width:600px){.message-content{max-width:84%}.messages{padding-bottom:125px}.card{box-shadow:none}}
</style>
</head>
<body>

<div id="root"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getDatabase, ref, push, set, query, limitToLast, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAM11KB7jbdZC0EiPyOgIawxzGZITgMA8",
  authDomain: "flash-feedback-9c529.firebaseapp.com",
  databaseURL: "https://flash-feedback-9c529-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "flash-feedback-9c529",
  storageBucket: "flash-feedback-9c529.firebasestorage.app",
  messagingSenderId: "1026286586523",
  appId: "1:1026286586523:web:b76e33473c260fc4d7143e",
  measurementId: "G-R93914YBXY"
};

const IMGBB_API_KEY = "0dade31c18202a2a4fd8b847ab3ef9e";
const CHAT_ID = "private-chat";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let myName = localStorage.getItem("chat_name") || "";
let selectedFile = null;
let sending = false;
let unsubscribeMessages = null;

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function toast(text, type="") {
  const el = $("toast");
  if (!el) return;
  el.className = "toast " + type;
  el.textContent = text;
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => {
    el.className = "";
    el.textContent = "";
  }, 3000);
}

function time(ts) {
  if (!ts) return "";
  return new Date(ts).toLocaleTimeString("ar-EG", {hour:"2-digit", minute:"2-digit"});
}

function avatar(name) {
  return "https://api.dicebear.com/9.x/initials/svg?seed=" + encodeURIComponent(name || "U");
}

function renderNameScreen() {
  $("root").innerHTML = `
    <div class="screen">
      <div class="card">
        <div style="text-align:center;margin-bottom:22px">
          <div class="logo" style="margin:auto;width:52px;height:52px;font-size:22px">C</div>
          <h1 style="margin:12px 0 5px;font-size:25px">الدردشة الخاصة</h1>
          <div class="note">اكتب اسمك فقط وابدأ المحادثة. لا يوجد حساب أو كلمة مرور.</div>
        </div>
        <label style="font-weight:800;font-size:13px">اسمك</label>
        <input id="nameInput" class="field" maxlength="60" placeholder="مثال: أحمد" value="${esc(myName)}" autocomplete="name">
        <button class="primary" id="enterBtn">دخول إلى الدردشة</button>
        <div class="note" style="margin-top:14px;text-align:center">سيتم حفظ الاسم على هذا الجهاز فقط.</div>
      </div>
    </div>`;
  $("enterBtn").addEventListener("click", enterChat);
  $("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") enterChat(); });
}

function renderChat() {
  $("root").innerHTML = `
    <div class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="logo">C</div>
            <div><div>الدردشة الخاصة</div><div class="status"><span class="dot"></span> متصل</div></div>
          </div>
          <button class="icon-btn" id="changeNameBtn" title="تغيير الاسم" aria-label="تغيير الاسم">
            <i class="fa-solid fa-user-pen"></i>
          </button>
        </div>
      </header>
      <main class="chat">
        <div id="messages" class="messages"><div class="empty">جارٍ تحميل الرسائل...</div></div>
      </main>
      <div class="composer-wrap">
        <div id="preview" class="preview hidden"></div>
        <div class="composer">
          <button id="imageBtn" class="icon-btn" title="إرسال صورة" aria-label="إرسال صورة"><i class="fa-regular fa-image"></i></button>
          <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
          <textarea id="messageInput" class="text" maxlength="2000" rows="1" placeholder="اكتب رسالة..."></textarea>
          <button id="sendBtn" class="send" title="إرسال" aria-label="إرسال"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>`;

  $("changeNameBtn").addEventListener("click", changeName);
  $("imageBtn").addEventListener("click", pickImage);
  $("fileInput").addEventListener("change", selectImage);
  $("sendBtn").addEventListener("click", sendMessage);
  bindComposer();
}

function bindComposer() {
  const input = $("messageInput");
  input.addEventListener("input", () => {
    input.style.height = "44px";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
}

async function ensureAnonymousAuth() {
  if (auth.currentUser) {
    currentUser = auth.currentUser;
    return currentUser;
  }
  try {
    const credential = await signInAnonymously(auth);
    currentUser = credential.user;
    return currentUser;
  } catch (error) {
    console.error("Anonymous Auth error:", error);
    throw new Error("تعذر تسجيل الدخول المجهول. فعّل Anonymous Authentication في Firebase.");
  }
}

async function enterChat() {
  const input = $("nameInput");
  const name = (input?.value || "").trim().replace(/\s+/g, " ").slice(0, 60);
  if (name.length < 2) {
    toast("اكتب اسمًا من حرفين على الأقل", "error");
    return;
  }
  myName = name;
  localStorage.setItem("chat_name", name);
  await startChat();
}

function changeName() {
  const next = prompt("اكتب الاسم الجديد:", myName);
  if (next === null) return;
  const name = next.trim().replace(/\s+/g, " ").slice(0, 60);
  if (name.length < 2) {
    toast("الاسم قصير جدًا", "error");
    return;
  }
  myName = name;
  localStorage.setItem("chat_name", name);
  renderChat();
  subscribeMessages();
}

function pickImage() {
  if (!IMGBB_API_KEY) {
    toast("ImgBB API Key غير موجود", "error");
    return;
  }
  $("fileInput").click();
}

function selectImage(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    toast("الملف المختار ليس صورة", "error");
    event.target.value = "";
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    toast("حجم الصورة يجب ألا يتجاوز 10MB", "error");
    event.target.value = "";
    return;
  }

  selectedFile = file;
  const preview = $("preview");
  const objectUrl = URL.createObjectURL(file);
  preview.classList.remove("hidden");
  preview.innerHTML = `
    <img src="${objectUrl}" alt="معاينة الصورة">
    <div style="flex:1">
      <div class="preview-label">${esc(file.name)}</div>
      <div class="preview-label">${Math.round(file.size / 1024)} KB</div>
    </div>
    <button id="clearImageBtn" title="إلغاء">✕</button>`;
  $("clearImageBtn").addEventListener("click", clearImage);
}

function clearImage() {
  selectedFile = null;
  const fileInput = $("fileInput");
  if (fileInput) fileInput.value = "";
  const preview = $("preview");
  if (preview) {
    preview.classList.add("hidden");
    preview.innerHTML = "";
  }
}

function compressImage(file, maxWidth=1600, quality=0.82) {
  return new Promise((resolve, reject) => {
    if (file.type === "image/gif") {
      resolve(file);
      return;
    }
    const reader = new FileReader();
    reader.onload = event => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          const ratio = maxWidth / width;
          width = maxWidth;
          height = Math.round(height * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, width);
        canvas.height = Math.max(1, height);
        const ctx = canvas.getContext("2d");
        if (!ctx) {
          reject(new Error("تعذر تجهيز الصورة."));
          return;
        }
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => {
          if (!blob) {
            reject(new Error("فشل ضغط الصورة."));
            return;
          }
          resolve(new File([blob], "chat-image.jpg", {type:"image/jpeg"}));
        }, "image/jpeg", quality);
      };
      img.onerror = () => reject(new Error("تعذر قراءة الصورة."));
      img.src = event.target.result;
    };
    reader.onerror = () => reject(new Error("تعذر قراءة الملف."));
    reader.readAsDataURL(file);
  });
}

async function uploadToImgBB(file) {
  if (!file) throw new Error("لم يتم اختيار صورة.");
  if (!file.type.startsWith("image/")) throw new Error("الملف المختار ليس صورة.");
  if (file.size > 10 * 1024 * 1024) throw new Error("حجم الصورة يجب ألا يتجاوز 10MB.");
  if (!IMGBB_API_KEY) throw new Error("لم يتم إضافة ImgBB API Key.");

  const compressedBlob = await compressImage(file);

  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const result = reader.result;
      if (typeof result !== "string" || !result.includes(",")) {
        reject(new Error("فشل تجهيز الصورة للرفع."));
        return;
      }
      resolve(result.split(",")[1]);
    };
    reader.onerror = () => reject(new Error("فشل تجهيز الصورة للرفع."));
    reader.readAsDataURL(compressedBlob);
  });

  const formData = new FormData();
  formData.append("image", base64);

  const response = await fetch(
    `https://api.imgbb.com/1/upload?key=${encodeURIComponent(IMGBB_API_KEY)}`,
    {method:"POST", body:formData}
  );

  const data = await response.json().catch(() => null);
  if (!response.ok || !data?.success || !data?.data?.url) {
    throw new Error(data?.error?.message || "فشل رفع الصورة إلى ImgBB.");
  }

  return {
    url: data.data.url,
    displayUrl: data.data.display_url || data.data.url,
    thumbnail: data.data.thumb?.url || data.data.url,
    deleteUrl: data.data.delete_url || "",
    originalSize: file.size,
    compressedSize: compressedBlob.size
  };
}

async function sendMessage() {
  if (sending) return;

  try {
    await ensureAnonymousAuth();

    const input = $("messageInput");
    const text = (input?.value || "").trim().slice(0, 2000);
    if (!text && !selectedFile) return;

    sending = true;
    $("sendBtn").disabled = true;
    $("imageBtn").disabled = true;

    let imageData = null;
    if (selectedFile) {
      toast("جارٍ رفع الصورة...");
      imageData = await uploadToImgBB(selectedFile);
    }

    const messagesRef = ref(db, `chats/${CHAT_ID}/messages`);
    const newMessageRef = push(messagesRef);

    await set(newMessageRef, {
      senderId: currentUser.uid,
      senderName: myName,
      text,
      imageUrl: imageData?.url || "",
      displayUrl: imageData?.displayUrl || "",
      thumbnail: imageData?.thumbnail || "",
      createdAt: serverTimestamp()
    });

    input.value = "";
    input.style.height = "44px";
    clearImage();
  } catch (error) {
    console.error("Send message error:", error);
    toast(error?.message || "تعذر إرسال الرسالة.", "error");
  } finally {
    sending = false;
    if ($("sendBtn")) $("sendBtn").disabled = false;
    if ($("imageBtn")) $("imageBtn").disabled = false;
  }
}

function subscribeMessages() {
  if (!currentUser) return;

  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  const messagesQuery = query(
    ref(db, `chats/${CHAT_ID}/messages`),
    limitToLast(200)
  );

  unsubscribeMessages = onValue(messagesQuery, snapshot => {
    const box = $("messages");
    if (!box) return;

    const messages = [];
    snapshot.forEach(child => {
      messages.push({id:child.key, ...(child.val() || {})});
    });

    if (!messages.length) {
      box.innerHTML = `
        <div class="empty">
          <div style="font-size:36px;margin-bottom:8px">💬</div>
          لا توجد رسائل بعد.<br>ابدأ المحادثة.
        </div>`;
      return;
    }

    box.innerHTML = messages.map(renderMessage).join("");
    requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
  }, error => {
    console.error("Messages listener error:", error);
    const box = $("messages");
    if (box) {
      box.innerHTML = `
        <div class="empty" style="color:var(--danger)">
          تعذر تحميل الرسائل.<br>
          تأكد من Firebase Rules وتفعيل Anonymous Authentication.
        </div>`;
    }
  });
}

function renderMessage(message) {
  const mine = message.senderId === currentUser?.uid;

  return `
    <div class="message ${mine ? "mine" : ""}">
      <img class="avatar" src="${esc(avatar(message.senderName))}" alt="">
      <div class="message-content">
        <div class="bubble">
          ${message.imageUrl ? `
            <img class="image" src="${esc(message.imageUrl)}" alt="صورة" loading="lazy"
              onclick="window.open('${esc(message.imageUrl)}','_blank','noopener,noreferrer')">
          ` : ""}
          ${message.text ? `<div>${esc(message.text).replace(/\n/g,"<br>")}</div>` : ""}
        </div>
        <div class="meta">${esc(message.senderName || "مستخدم")} · ${time(message.createdAt)}</div>
      </div>
    </div>`;
}

async function startChat() {
  if (!myName) {
    renderNameScreen();
    return;
  }

  renderChat();

  try {
    await ensureAnonymousAuth();
    subscribeMessages();
  } catch (error) {
    console.error(error);
    $("messages").innerHTML = `
      <div class="empty" style="color:var(--danger)">
        تعذر الاتصال بالمحادثة.<br>
        فعّل <b>Anonymous</b> في Firebase Authentication.
      </div>`;
  }
}

if (myName) startChat();
else renderNameScreen();
</script>
</body>
</html>
